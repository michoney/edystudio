<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Earth AI Command Center</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:monospace;
    color:#00eaff;
}
#hud{
    position:absolute;
    top:30px;
    left:30px;
    z-index:10;
    background:rgba(0,20,40,.45);
    border:1px solid #00eaff;
    padding:20px;
    width:280px;
    backdrop-filter:blur(8px);
}
.title{
    font-size:22px;
    letter-spacing:3px;
}
.data{
    margin-top:15px;
    line-height:1.8;
    color:white;
}
#status{
    color:#00ff88;
}
</style>
</head>
<body>

<div id="hud">
<div class="title">🌍 EARTH AI</div>
<div>GLOBAL MONITORING SYSTEM</div>
<hr>
<div class="data">
LOCATION: PACIFIC OCEAN<br>
TEMP: <span id="temp">26°C</span><br>
CLOUD: 68%<br>
WIND: 12 km/h<br>
SATELLITE: ONLINE<br>
AI CORE: <span id="status">CONNECTED</span>
</div>
</div>

<script>
console.log('Starting Earth AI...');

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 3;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
console.log('Renderer created');

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableZoom = true;
console.log('Controls created');

// Stars
const starsGeometry = new THREE.BufferGeometry();
const starPos = [];
for (let i = 0; i < 3000; i++) {
    starPos.push((Math.random() - 0.5) * 200, (Math.random() - 0.5) * 200, (Math.random() - 0.5) * 200);
}
starsGeometry.setAttribute("position", new THREE.Float32BufferAttribute(starPos, 3));
const stars = new THREE.Points(starsGeometry, new THREE.PointsMaterial({ color: 0xffffff, size: 0.05 }));
scene.add(stars);

const loader = new THREE.TextureLoader();

// Earth
const earthTexture = loader.load("https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg");
const earth = new THREE.Mesh(
    new THREE.SphereGeometry(1, 64, 64),
    new THREE.MeshStandardMaterial({ map: earthTexture })
);
scene.add(earth);
console.log('Earth added');

// Clouds
const cloudTexture = loader.load("https://threejs.org/examples/textures/planets/earth_clouds_1024.png");
const clouds = new THREE.Mesh(
    new THREE.SphereGeometry(1.015, 64, 64),
    new THREE.MeshStandardMaterial({ map: cloudTexture, transparent: true, opacity: 0.35 })
);
scene.add(clouds);

// Atmosphere
const atmosphere = new THREE.Mesh(
    new THREE.SphereGeometry(1.08, 64, 64),
    new THREE.MeshBasicMaterial({ color: 0x0099ff, transparent: true, opacity: 0.12, side: THREE.BackSide })
);
scene.add(atmosphere);

// Light
const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(5, 3, 5);
scene.add(light);

function animate() {
    requestAnimationFrame(animate);
    earth.rotation.y += 0.002;
    clouds.rotation.y += 0.001;
    renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

console.log('Earth AI ready!');
</script>
</body>
</html>
