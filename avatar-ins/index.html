  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0a0a0c; min-height: 100vh; color: #e8e6e3; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; }

  .bg { position: fixed; inset: 0; z-index: -1;
    background: radial-gradient(900px 500px at 85% -10%, rgba(196,124,40,.12), transparent 60%),
                radial-gradient(800px 500px at -10% 40%, rgba(120,60,150,.10), transparent 60%),
                linear-gradient(180deg, #0d0d10, #08080a); }

  .bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 16px;
    background: rgba(10,10,12,.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(255,255,255,.07);
  }
  .bar .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .bar .brand a { color: #e8a87c; text-decoration: none; font-weight: 700; font-size: 15px; letter-spacing: .02em; white-space: nowrap; }
  .bar .brand span { color: #6d6d74; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .cnt { font-size: 11px; color: #8a8a90; letter-spacing: .12em; white-space: nowrap; padding: 5px 12px; border: 1px solid rgba(255,255,255,.12); border-radius: 999px; background: rgba(255,255,255,.04); }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 14px 12px 60px; }

  /* ins 风格方形网格 */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
  }
  @media (min-width: 560px)  { .grid { grid-template-columns: repeat(4, 1fr); } }
  @media (min-width: 800px)  { .grid { grid-template-columns: repeat(5, 1fr); } }
  @media (min-width: 1080px) { .grid { grid-template-columns: repeat(6, 1fr); } }

  .cell {
    position: relative; aspect-ratio: 1; overflow: hidden; cursor: zoom-in;
    background: #121216; border: none; padding: 0; display: block;
  }
  .cell img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform .35s ease, opacity .25s ease;
  }
  .cell:hover img { transform: scale(1.07); opacity: .92; }
  .cell .tip {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 8px 6px;
    background: linear-gradient(180deg, transparent, rgba(4,4,6,.85));
    font-size: 10px; letter-spacing: .04em; color: #eee; text-align: left;
    opacity: 0; transition: opacity .2s ease; pointer-events: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cell:hover .tip { opacity: 1; }

  /* lightbox */
  .lb {
    position: fixed; inset: 0; z-index: 100; display: none;
    align-items: center; justify-content: center;
    background: rgba(4,4,6,.92); backdrop-filter: blur(6px);
    padding: 30px; cursor: zoom-out;
  }
  .lb.open { display: flex; }
  .lb img {
    max-width: 88vw; max-height: 84vh; object-fit: contain;
    border-radius: 10px; box-shadow: 0 30px 90px rgba(0,0,0,.6);
    cursor: default;
  }
  .lb .info {
    position: fixed; bottom: 22px; left: 0; right: 0; text-align: center;
    font-size: 13px; color: #ccc; letter-spacing: .06em;
  }
  .lb .info b { color: #fff; }
  .lb .x {
    position: fixed; top: 16px; right: 20px; font-size: 26px; color: #aaa; cursor: pointer;
    width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%;
    background: rgba(255,255,255,.07); transition: .2s;
  }
  .lb .x:hover { color: #fff; background: rgba(255,255,255,.16); }

  .foot { text-align: center; padding: 34px 10px 8px; color: #5d5d64; font-size: 11px; letter-spacing: .1em; }
  .foot a { color: #8f8f96; text-decoration: none; border-bottom: 1px dashed #4a4a50; }

const cnt = document.getElementById('cnt');
cnt.textContent = PINS.length + ' 张';

function openLB(i) {
  const p = PINS[i];
  const img = document.getElementById('lbImg');
  img.src = p.img;
  img.alt = p.title;
  document.getElementById('lbInfo').innerHTML = `<b>${p.title}</b> · ${p.sub}` + (p.href ? ` · <a href="${p.href}" target="_blank" style="color:#e8a87c">原图 ↗</a>` : '');
  document.getElementById('lb').classList.add('open');
}
function closeLB() { document.getElementById('lb').classList.remove('open'); }
document.getElementById('lb').addEventListener('click', e => { if (e.target.id === 'lb') closeLB(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLB(); });

PINS.forEach((p, i) => {
  const btn = document.createElement('button');
  btn.className = 'cell';
  btn.title = p.title;
  const img = document.createElement('img');
  img.loading = 'lazy';
  img.src = p.img;
  img.alt = p.title;
  btn.appendChild(img);
  const tip = document.createElement('div');
  tip.className = 'tip';
  tip.textContent = p.title;
  btn.appendChild(tip);
  btn.onclick = () => openLB(i);
  grid.appendChild(btn);
});
