<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>像素点阵画 · 超哥严选 Skill · EdyStudio</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #030303; color: #f0f0ea; }
    body { min-height: 100vh; overflow: hidden; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; }
    .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle at 38% 45%, transparent 8%, rgba(0,0,0,.08) 45%, rgba(0,0,0,.88) 100%); }
    main { position: relative; z-index: 1; min-height: 100vh; display: grid; align-content: space-between; padding: clamp(24px, 5vw, 72px); pointer-events: none; }
    header { display: flex; justify-content: space-between; align-items: center; font-size: 11px; letter-spacing: .18em; color: #aaa; }
    .dot { display: inline-block; width: 7px; height: 7px; margin-right: 9px; border-radius: 50%; background: #e9e9e3; box-shadow: 0 0 18px #fff; }
    section { max-width: min(620px, 46vw); margin-left: auto; position: relative; z-index: 2; text-align: right; }
    .eyebrow { margin: 0 0 18px; font-size: 12px; letter-spacing: .28em; color: #aaa; }
    h1 { margin: 0; font: 500 clamp(52px, 10vw, 138px)/.82 Arial, sans-serif; letter-spacing: -.075em; }
    p { max-width: 560px; margin: 28px 0 0; color: #b7b7b1; font: 14px/1.75 system-ui, sans-serif; }
    footer { display: flex; gap: 28px; font-size: 10px; letter-spacing: .13em; color: #777; }
    @media (max-width: 760px) {
      section { max-width: 82vw; margin: auto 0 0 auto; padding: 18px; background: linear-gradient(135deg, transparent, rgba(0,0,0,.72)); }
      h1 { font-size: clamp(54px, 18vw, 92px); }
      p { max-width: 76vw; }
    }
  </style>
</head>
<body>
  <canvas id="field"></canvas>
  <div class="vignette"></div>
  <main>
    <header><span><i class="dot"></i>超哥严选 SKILL</span><span>EDGE PARTICLES / MONO</span></header>
    <section>
      <p class="eyebrow">PIXEL DITHER ART</p>
      <h1>像素<br>点阵画.</h1>
      <p>取自猫侧脸参考的边缘粒子画法：用稀疏灰白光点描出 404 小子、双金币与推车，黑色留白不填满。</p>
    </section>
    <footer><span>EDY.AI.STUDIO</span><span>MONOCHROME</span><span>FLIP-DOT MOTION</span></footer>
  </main>
  <script>
    const canvas = document.querySelector('#field');
    const ctx = canvas.getContext('2d', { alpha: false });
    const BAYER = [0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5].map(v => (v + .5) / 16);
    const source = document.createElement('canvas');
    const sctx = source.getContext('2d', { willReadFrequently: true });
    const image = new Image();
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let w = 1, h = 1, cell = 5, cols = 1, rows = 1, pixels = null;
    let portrait = { dx: 0, dy: 0, dw: 1, dh: 1 };

    const clamp01 = v => Math.max(0, Math.min(1, v));
    const hash = (x, y) => {
      const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
      return n - Math.floor(n);
    };
    const luminanceAt = (x, y) => {
      x = Math.max(0, Math.min(cols - 1, x));
      y = Math.max(0, Math.min(rows - 1, y));
      const i = (y * cols + x) * 4;
      return pixels[i] * .2126 + pixels[i + 1] * .7152 + pixels[i + 2] * .0722;
    };

    function rebuild() {
      w = innerWidth; h = innerHeight;
      cell = w < 760 ? 5 : 6;
      canvas.width = w; canvas.height = h;
      cols = Math.ceil(w / cell); rows = Math.ceil(h / cell);
      source.width = cols; source.height = rows;
      sctx.fillStyle = '#030303'; sctx.fillRect(0, 0, cols, rows);
      if (!image.naturalWidth) return;
      // 保留 404 小子、双金币和推车，排除外围机房。
      const sx = image.naturalWidth * .10;
      const sy = image.naturalHeight * .22;
      const sw = image.naturalWidth * .59;
      const sh = image.naturalHeight * .68;
      const dh = rows * .92;
      const dw = dh * (sw / sh);
      const dx = (cols - dw) * .30;
      const dy = (rows - dh) / 2;
      portrait = { dx, dy, dw, dh };
      sctx.drawImage(image, sx, sy, sw, sh, dx, dy, dw, dh);
      pixels = sctx.getImageData(0, 0, cols, rows).data;
    }

    function draw(ms) {
      ctx.fillStyle = '#030303'; ctx.fillRect(0, 0, w, h);
      if (!pixels) { requestAnimationFrame(draw); return; }
      const t = reduceMotion ? 0 : ms / 1000;
      const breath = 1 + Math.sin(t * .9) * .006;
      ctx.save();
      ctx.translate(w / 2, h / 2);
      ctx.scale(breath, breath);
      ctx.translate(-w / 2, -h / 2);
      for (let y = 0; y < rows; y++) {
        const waveX = Math.sin(y * .105 + t * 1.15) * 2.8;
        for (let x = 0; x < cols; x++) {
          const u = (x - portrait.dx) / portrait.dw;
          const v = (y - portrait.dy) / portrait.dh;
          if (u < 0 || u > 1 || v < 0 || v > 1) continue;
          const boyHead = ((u - .27) / .19) ** 2 + ((v - .25) / .24) ** 2;
          const boyBody = ((u - .27) / .24) ** 2 + ((v - .57) / .38) ** 2;
          const coins = ((u - .70) / .28) ** 2 + ((v - .39) / .34) ** 2;
          const cartX = Math.abs((u - .61) / .39);
          const cartY = Math.abs((v - .76) / .16);
          const cart = Math.max(cartX, cartY);
          const mask = clamp01(1.22 - Math.min(boyHead, boyBody, coins, cart));
          if (mask <= 0) continue;
          const luminance = luminanceAt(x, y);
          const gx = Math.abs(luminanceAt(x + 1, y) - luminanceAt(x - 1, y));
          const gy = Math.abs(luminanceAt(x, y + 1) - luminanceAt(x, y - 1));
          const edge = clamp01((gx + gy) / 92);
          const local = (luminanceAt(x - 2, y) + luminanceAt(x + 2, y) + luminanceAt(x, y - 2) + luminanceAt(x, y + 2)) / 4;
          const highlight = clamp01((luminance - 128) / 127);
          const texture = clamp01(Math.abs(luminance - local) / 58);
          const signal = clamp01((edge * .78 + texture * .34 + highlight * .13) * mask);
          const threshold = BAYER[(y % 4) * 4 + (x % 4)];
          if (signal < threshold * .62) continue;
          const scan = .5 + .5 * Math.sin(y * .12 - t * 1.7);
          const sparkle = signal > .3 && hash(x, y) > .988 ? 1 : 0;
          const gray = Math.round(72 + signal * 183);
          const size = .7 + signal * 2.15 + scan * .3 + sparkle * 2.8;
          const waveY = Math.sin(x * .075 - t * .72) * 1.5;
          // 每个点是一枚微型翻牌；相位沿 X 轴递延，形成横向翻牌波。
          const flip = reduceMotion ? 1 : Math.cos(t * 1.85 - x * .072 - y * .006);
          const flipWidth = .07 + Math.abs(flip) * .93;
          const edgeFlash = Math.pow(1 - Math.abs(flip), 7) * .32;
          const alpha = Math.min(1, .34 + signal * .66 + edgeFlash);
          ctx.fillStyle = `rgba(${gray},${gray},${gray},${alpha})`;
          const px = x * cell + waveX;
          const py = y * cell + waveY;
          ctx.beginPath();
          ctx.ellipse(px, py, size * flipWidth / 2, size / 2, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
      requestAnimationFrame(draw);
    }

    image.onload = rebuild;
    image.src = 'assets/pixel-dither-404-boy.png';
    addEventListener('resize', rebuild);
    rebuild(); requestAnimationFrame(draw);
  </script>
</body>
</html>
