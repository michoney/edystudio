<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>像素点阵画 · 超哥严选 Skill · EdyStudio</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #030303; color: #f0f0ea; }
    body { min-height: 100vh; overflow: hidden; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; }
    .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle at 58% 45%, transparent 12%, rgba(0,0,0,.12) 48%, rgba(0,0,0,.82) 100%); }
    main { position: relative; z-index: 1; min-height: 100vh; display: grid; align-content: space-between; padding: clamp(24px, 5vw, 72px); pointer-events: none; }
    header { display: flex; justify-content: space-between; align-items: center; font-size: 11px; letter-spacing: .18em; color: #aaa; }
    .dot { display: inline-block; width: 7px; height: 7px; margin-right: 9px; border-radius: 50%; background: #e9e9e3; box-shadow: 0 0 18px #fff; }
    section { max-width: 820px; position: relative; z-index: 2; }
    .eyebrow { margin: 0 0 18px; font-size: 12px; letter-spacing: .28em; color: #aaa; }
    h1 { margin: 0; font: 500 clamp(52px, 10vw, 138px)/.82 Arial, sans-serif; letter-spacing: -.075em; }
    p { max-width: 560px; margin: 28px 0 0; color: #b7b7b1; font: 14px/1.75 system-ui, sans-serif; }
    footer { display: flex; gap: 28px; font-size: 10px; letter-spacing: .13em; color: #777; }
    .portrait-wrap { position: fixed; z-index: 1; right: clamp(18px, 5vw, 78px); bottom: -5vh; width: min(47vw, 700px); height: 91vh; overflow: hidden; border-radius: 42% 42% 8px 8px; box-shadow: 0 34px 100px rgba(0,0,0,.75); animation: portrait-in 1.6s cubic-bezier(.16,1,.3,1) both, portrait-float 7s ease-in-out 1.6s infinite; }
    .portrait-wrap::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(3,3,3,.62)); pointer-events: none; }
    .portrait { width: 100%; height: 100%; object-fit: cover; object-position: 38% 50%; filter: saturate(.8) contrast(1.08); animation: portrait-push 12s ease-in-out infinite alternate; }
    @keyframes portrait-in { from { opacity: 0; transform: translateY(70px) scale(.94); filter: blur(14px); } to { opacity: 1; transform: none; filter: blur(0); } }
    @keyframes portrait-float { 0%,100% { transform: translateY(0) rotate(-.25deg); } 50% { transform: translateY(-16px) rotate(.25deg); } }
    @keyframes portrait-push { from { transform: scale(1.02) translate3d(0,0,0); } to { transform: scale(1.09) translate3d(-1.5%,-1%,0); } }
    @media (max-width: 760px) {
      .portrait-wrap { right: -20vw; width: 90vw; height: 78vh; opacity: .7; }
      h1 { font-size: clamp(54px, 18vw, 92px); }
      p { max-width: 58vw; }
    }
    @media (prefers-reduced-motion: reduce) { .portrait-wrap, .portrait { animation: none; } }
  </style>
</head>
<body>
  <canvas id="field"></canvas>
  <div class="vignette"></div>
  <figure class="portrait-wrap"><img class="portrait" src="assets/pixel-dither-xiaopeng.jpg" alt="像素点阵画人物演示"></figure>
  <main>
    <header><span><i class="dot"></i>超哥严选 SKILL</span><span>BAYER 4×4 / 8PX</span></header>
    <section>
      <p class="eyebrow">PIXEL DITHER ART</p>
      <h1>像素<br>点阵画.</h1>
      <p>主体保持清晰，背景采用 4×4 Bayer 有序抖动、明显方形像素与缓慢漂移的单色云场。适合人物、产品与品牌主视觉。</p>
    </section>
    <footer><span>EDY.AI.STUDIO</span><span>MONOCHROME</span><span>PROCEDURAL</span></footer>
  </main>
  <script>
    const canvas = document.querySelector('#field');
    const ctx = canvas.getContext('2d', { alpha: false });
    const BAYER = [0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5].map(v => (v + .5) / 16);
    const palette = ['#030303','#0d0e0f','#1c1d1f','#343538','#5f6064','#a7a8aa','#eeeeea'];
    const cell = 8;
    let cols, rows, w, h;
    const clamp = v => Math.max(0, Math.min(1, v));
    const smooth = (a,b,x) => { const t=clamp((x-a)/(b-a)); return t*t*(3-2*t); };
    const hash = (x,y) => { const n=Math.sin(x*127.1+y*311.7)*43758.5453; return n-Math.floor(n); };
    function noise(x,y){
      const ix=Math.floor(x), iy=Math.floor(y), fx=x-ix, fy=y-iy;
      const ux=fx*fx*(3-2*fx), uy=fy*fy*(3-2*fy);
      return hash(ix,iy)*(1-ux)*(1-uy)+hash(ix+1,iy)*ux*(1-uy)+hash(ix,iy+1)*(1-ux)*uy+hash(ix+1,iy+1)*ux*uy;
    }
    function fbm(x,y){ let v=0,a=.5,f=1; for(let i=0;i<4;i++){v+=noise(x*f,y*f)*a;f*=2.03;a*=.5;} return v; }
    function resize(){ w=innerWidth; h=innerHeight; canvas.width=w; canvas.height=h; cols=Math.ceil(w/cell); rows=Math.ceil(h/cell); }
    function sample(x,y,t){
      const nx=(x/cols-.5)*2, ny=(y/rows-.5)*2;
      const vignette=1-smooth(.18,1.14,Math.sqrt(nx*nx*.72+ny*ny*1.25));
      const wave=Math.sin(nx*3.2+ny*1.1+t*.3)*.20+Math.sin(-nx*1.6+ny*4.1-t*.22)*.14;
      const cloud=fbm(nx*1.6+t*.045,ny*1.6-t*.026);
      const ridge=smooth(.42,.88,cloud+wave);
      const mass=1-smooth(.18,1.05,Math.hypot(nx-.22,ny+.04));
      return clamp(ridge*vignette*.98+mass*.24);
    }
    function draw(ms){
      ctx.fillStyle=palette[0]; ctx.fillRect(0,0,w,h);
      const t=ms/1000;
      for(let y=0;y<rows;y++) for(let x=0;x<cols;x++){
        const value=sample(x,y,t);
        const threshold=BAYER[(y%4)*4+x%4];
        const quant=clamp(value+(threshold-.5)*.20);
        const index=Math.min(palette.length-1,Math.floor(quant*palette.length));
        ctx.fillStyle=palette[index]; ctx.fillRect(x*cell,y*cell,cell,cell);
      }
      requestAnimationFrame(draw);
    }
    addEventListener('resize',resize); resize(); requestAnimationFrame(draw);
  </script>
</body>
</html>
