          ['提示词人工检查', 'AI 生成的提示词必须人工过一遍再提交（deepseek-v4-flash 一次不到一分钱）。'],
          ['4 步 Turbo 采样', 'turbo_4step_v1.1_768p LoRA + simple 调度，4 步出片。'],
          ['Sigma 精修 + VSR + 卸载', 'H3SigmaShift 调视频/音频 sigma；RTX VSR 放大；采样后自动卸载显存。'],
          ['抽帧验收', '逐帧查动作与身份；真实人物 LoRA 带来的动作偏移按情况接受或调强度。']
        ],
        locks: '真实人物 LoRA 会轻微改变人物动作 —— 按情况调强度或忽略；AI 生成的提示词一律人工检查后再提交。',
        lockLabel: 'LOCK / 纪律',
        params: [['4 步', '采样步数'], ['真实人物', 'LoRA'], ['< 1 分', 'AI 提示词/次']],
        command: '使用 $minimax-h3-mgouliang-v1-05，用 50.23 的 v1.05 真实人物流程处理当前镜头（真实人物 LoRA + 4 步 Turbo + Sigma 精修）。先向我展示并确认素材、提示词与参数，我明确确认后才提交。'
      }
    ];

    const root = document.querySelector('#skills');
    const skillCommands = [];
    SKILLS.forEach((s, i) => {
      skillCommands.push(s.command);
      const sec = document.createElement('section');
      sec.className = 'skill-panel';
      sec.dataset.badge = s.badge;
      sec.dataset.index = String(i + 1).padStart(2, '0');
      sec.setAttribute('aria-label', 'MiniMax H3 ' + s.title + ' 工作流程');
      sec.innerHTML =
        '<p class="eyebrow">' + s.eyebrow + '</p>' +
        '<h1>' + s.title + '<span>' + s.code + '</span></h1>' +
        '<div class="route">' + s.route + '</div>' +
        '<ol class="steps">' + s.steps.map(([b, d]) => '<li><b>' + b + '</b>' + d + '</li>').join('') + '</ol>' +
        '<div class="locks"><strong>' + s.lockLabel + '</strong><br>' + s.locks + '</div>' +
        '<div class="params">' + s.params.map(([v, k]) => '<span><b>' + v + '</b>' + k + '</span>').join('') + '</div>' +
        '<button class="copy-command" type="button" data-idx="' + i + '">复制技能命令 / COPY COMMAND</button>' +
        (i === 0 ? '<a class="related" href="ai-video/ai-manju/"><span class="rel-label">RELATED / 延伸阅读</span><strong>AI 人物一致性控制 · 角色卡制作 Skill</strong><span class="rel-desc">出图前先把角色锁死：脸、身材、发型、表情、服装与视角一次性固定下来，含可直接复制的角色设定板提示词。</span><span class="rel-go">打开文章 →</span></a>' : '') +
        '<div class="src"><b>来源</b> ' + s.src + '</div>';
      root.append(sec);
    });

    root.addEventListener('click', async (ev) => {
      const btn = ev.target.closest('.copy-command');
      if (!btn) return;
      const text = skillCommands[Number(btn.dataset.idx)];
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const fallback = document.createElement('textarea');
        fallback.value = text;
        fallback.style.position = 'fixed'; fallback.style.opacity = '0';
        document.body.append(fallback); fallback.select(); document.execCommand('copy'); fallback.remove();
      }
      btn.dataset.copied = 'true';
      btn.textContent = '已复制 / COPIED';
      setTimeout(() => {
        btn.dataset.copied = 'false';
        btn.textContent = '复制技能命令 / COPY COMMAND';
      }, 1800);
    });

    const canvas = document.querySelector('#field');
    const ctx = canvas.getContext('2d', { alpha: false });
    const BAYER = [0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5].map(v => (v + .5) / 16);
    const source = document.createElement('canvas');
    const sctx = source.getContext('2d', { willReadFrequently: true });
    const image = new Image();
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let w = 1, h = 1, cell = 5, cols = 1, rows = 1, pixels = null;
    let portrait = { dx: 0, dy: 0, dw: 1, dh: 1 };

    const clamp01 = v => Math.max(0, Math.min(1, v));
    const hash = (x, y) => {
      const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
      return n - Math.floor(n);
    };
    const luminanceAt = (x, y) => {
      x = Math.max(0, Math.min(cols - 1, x));
      y = Math.max(0, Math.min(rows - 1, y));
      const i = (y * cols + x) * 4;
      return pixels[i] * .2126 + pixels[i + 1] * .7152 + pixels[i + 2] * .0722;
    };

    function rebuild() {
      w = innerWidth; h = innerHeight;
      cell = w < 760 ? 5 : 6;
      canvas.width = w; canvas.height = h;
      cols = Math.ceil(w / cell); rows = Math.ceil(h / cell);
      source.width = cols; source.height = rows;
      sctx.fillStyle = '#030303'; sctx.fillRect(0, 0, cols, rows);
      if (!image.naturalWidth) return;
      // 保留 404 小子、双金币和推车，排除外围机房。
      const sx = image.naturalWidth * .10;
      const sy = image.naturalHeight * .22;
      const sw2 = image.naturalWidth * .59;
      const sh = image.naturalHeight * .68;
      const ratio = sw2 / sh;
      const mobile = w < 760;
      const dw = mobile ? cols * .94 : rows * .92 * ratio;
      const dh = mobile ? dw / ratio : rows * .92;
      const dx = mobile ? (cols - dw) / 2 : (cols - dw) * .30;
      const dy = mobile ? (rows - dh) * .46 : (rows - dh) / 2;
      portrait = { dx, dy, dw, dh };
      sctx.drawImage(image, sx, sy, sw2, sh, dx, dy, dw, dh);
      pixels = sctx.getImageData(0, 0, cols, rows).data;
    }

    function draw(ms) {
      ctx.fillStyle = '#030303'; ctx.fillRect(0, 0, w, h);
      if (!pixels) { requestAnimationFrame(draw); return; }
      const t = reduceMotion ? 0 : ms / 1000;
      const breath = 1 + Math.sin(t * .9) * .006;
      ctx.save();
      ctx.translate(w / 2, h / 2);
      ctx.scale(breath, breath);
      ctx.translate(-w / 2, -h / 2);
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const u = (x - portrait.dx) / portrait.dw;
          const v = (y - portrait.dy) / portrait.dh;
          if (u < 0 || u > 1 || v < 0 || v > 1) continue;
          const boyHead = ((u - .27) / .19) ** 2 + ((v - .25) / .24) ** 2;
          const boyBody = ((u - .27) / .24) ** 2 + ((v - .57) / .38) ** 2;
          const coins = ((u - .70) / .28) ** 2 + ((v - .39) / .34) ** 2;
          const cartX = Math.abs((u - .61) / .39);
          const cartY = Math.abs((v - .76) / .16);
          const cart = Math.max(cartX, cartY);
          const mask = clamp01(1.22 - Math.min(boyHead, boyBody, coins, cart));
          if (mask <= 0) continue;
          const luminance = luminanceAt(x, y);
          const gx = Math.abs(luminanceAt(x + 1, y) - luminanceAt(x - 1, y));
          const gy = Math.abs(luminanceAt(x, y + 1) - luminanceAt(x, y - 1));
          const edge = clamp01((gx + gy) / 92);
          const local = (luminanceAt(x - 2, y) + luminanceAt(x + 2, y) + luminanceAt(x, y - 2) + luminanceAt(x, y + 2)) / 4;
          const highlight = clamp01((luminance - 128) / 127);
          const texture = clamp01(Math.abs(luminance - local) / 58);
          const signal = clamp01((edge * .78 + texture * .34 + highlight * .13) * mask);
          const threshold = BAYER[(y % 4) * 4 + (x % 4)];
          if (signal < threshold * .62) continue;
          const sparkle = signal > .3 && hash(x, y) > .988 ? 1 : 0;
          const gray = Math.round(72 + signal * 183);
          const neuralSeed = hash(x * 1.91, y * 2.37);
          // 仅约 0.15% 的可见点可成为放电节点，且异步脉冲，控制同屏活跃数量。
          const isNeuron = neuralSeed > .9985;
          const neuralPhase = hash(x * 3.17, y * 5.13) * Math.PI * 2;
          const neuralSpeed = .55 + hash(x * 7.01, y * 1.73) * 1.45;
          const discharge = reduceMotion || !isNeuron
            ? 0
            : Math.pow(Math.max(0, Math.sin(t * neuralSpeed + neuralPhase)), 18);
          const size = .7 + signal * 2.15 + sparkle * 2.8 + discharge * 4.2;
          const alpha = Math.min(1, .34 + signal * .66 + discharge * .55);
          ctx.fillStyle = `rgba(${gray},${gray},${gray},${alpha})`;
          const px = x * cell;
          const py = y * cell;
          if (discharge > .16) {
            const angle = neuralSeed * Math.PI * 10;
            const reach = cell * (2.2 + hash(x * 4.7, y * 8.9) * 4.8) * discharge;
            ctx.strokeStyle = `rgba(225,225,220,${discharge * .58})`;
            ctx.lineWidth = .45 + discharge * .85;
            ctx.beginPath();
            ctx.moveTo(px, py);
            ctx.lineTo(px + Math.cos(angle) * reach, py + Math.sin(angle) * reach);
            ctx.stroke();
          }
          ctx.beginPath();
          ctx.arc(px, py, size / 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
      requestAnimationFrame(draw);
    }

    image.onload = rebuild;
    image.src = 'assets/pixel-dither-404-boy.png';
    addEventListener('resize', rebuild);
    rebuild(); requestAnimationFrame(draw);
  </script>
</body>
</html>
