<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moss Memory — EdyStudio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap');
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#050607;color:#eee}body{font-family:'DM Sans',sans-serif}.stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 52% 54%,#181b1b 0,#080a0b 42%,#030405 78%);perspective:1100px}.noise{position:absolute;inset:0;opacity:.12;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E")}.nav{position:fixed;z-index:20;left:0;right:0;top:0;height:84px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(22px,4vw,64px);font-size:11px;letter-spacing:.18em;text-transform:uppercase}.nav a{color:inherit;text-decoration:none}.brand{font-family:'Instrument Serif',serif;font-size:23px;text-transform:none;letter-spacing:0}.status{display:flex;align-items:center;gap:11px;color:#a5aaa5}.dot{width:6px;height:6px;border-radius:50%;background:#9cb360;box-shadow:0 0 14px #a8c66c}.copy{position:absolute;z-index:8;top:14%;left:clamp(24px,6vw,90px);max-width:440px;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#8e958d;margin-bottom:18px}.copy h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(48px,7vw,108px);line-height:.83;letter-spacing:-.035em}.copy h1 i{display:block;color:#9da987;font-weight:400}.copy p{margin-top:28px;max-width:330px;color:#8e948f;font-size:12px;line-height:1.75}.scene{position:absolute;left:50%;top:55%;width:min(1240px,115vw);aspect-ratio:1600/760;transform:translate(-50%,-50%) rotateX(5deg) rotateZ(-4deg);transform-style:preserve-3d;filter:drop-shadow(0 42px 38px #000c);will-change:transform}.branch{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;pointer-events:none}.dry{filter:saturate(.45) contrast(1.1) brightness(.72)}.living{--x:50%;--y:50%;-webkit-mask-image:radial-gradient(circle 25vmin at var(--x) var(--y),#000 0 30%,rgba(0,0,0,.94) 42%,rgba(0,0,0,.55) 63%,transparent 100%);mask-image:radial-gradient(circle 25vmin at var(--x) var(--y),#000 0 30%,rgba(0,0,0,.94) 42%,rgba(0,0,0,.55) 63%,transparent 100%);filter:saturate(1.25) brightness(1.06) drop-shadow(0 0 18px #82955a30)}.lens{position:absolute;z-index:6;width:min(46vmin,430px);aspect-ratio:1;border-radius:50%;left:50%;top:54%;transform:translate(-50%,-50%);pointer-events:none;background:radial-gradient(circle,transparent 0 43%,#0001 56%,#0008 78%,#0000 100%);box-shadow:inset 0 0 70px #0008,0 0 0 1px #dfe9d210;mix-blend-mode:multiply}canvas{position:absolute;inset:0;width:100%;height:100%;z-index:7;pointer-events:none}.hint{position:fixed;z-index:12;left:50%;bottom:34px;transform:translateX(-50%);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#777f78;white-space:nowrap}.hint:before{content:'';display:inline-block;width:34px;height:1px;background:#777;margin-right:12px;vertical-align:middle}.coords{position:fixed;right:clamp(22px,4vw,64px);bottom:32px;color:#5f6660;font:10px/1.5 monospace;text-align:right}@media(max-width:680px){.copy{top:13%}.copy h1{font-size:58px}.copy p{max-width:270px}.scene{top:59%;width:145vw}.lens{width:58vmin}.status{display:none}.coords{display:none}.hint{bottom:22px}}@media(prefers-reduced-motion:reduce){.hint{display:none}}
</style></head><body><main class="stage" id="stage"><nav class="nav"><a class="brand" href="../">EdyStudio / Moss Memory</a><div class="status"><span class="dot"></span>living layer detected</div></nav><section class="copy"><div class="eyebrow">A study in concealed life</div><h1>Layers hold<i>tales of time.</i></h1><p>Move across the branch. Beneath the dry surface, moss and tiny blossoms wait for light.</p></section><div class="scene" id="scene"><img class="branch dry" src="dry-branch.svg" alt="手工绘制的干枯树枝"><img class="branch living" id="living" src="moss-branch.svg" alt="覆有苔藓和小花的树枝"></div><div class="lens" id="lens"></div><canvas id="dust"></canvas><div class="noise"></div><div class="hint">move to reveal the living layer</div><div class="coords" id="coords">X 050<br>Y 050</div></main>
<script>
(()=>{const stage=document.getElementById('stage'),scene=document.getElementById('scene'),living=document.getElementById('living'),lens=document.getElementById('lens'),coords=document.getElementById('coords'),canvas=document.getElementById('dust'),ctx=canvas.getContext('2d');let tx=.52,ty=.54,x=tx,y=ty,w=innerWidth,h=innerHeight,dpr=Math.min(devicePixelRatio,2),particles=[],last=0;function size(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio,2);canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}size();addEventListener('resize',size,{passive:true});function aim(px,py){tx=px/w;ty=py/h;coords.innerHTML=`X ${String(Math.round(tx*100)).padStart(3,'0')}<br>Y ${String(Math.round(ty*100)).padStart(3,'0')}`};addEventListener('pointermove',e=>aim(e.clientX,e.clientY),{passive:true});addEventListener('touchmove',e=>{const t=e.touches[0];if(t)aim(t.clientX,t.clientY)},{passive:true});function puff(now){if(now-last<34)return;last=now;const n=Math.random()<.45?2:1;for(let i=0;i<n;i++)particles.push({x:x*w+(Math.random()-.5)*110,y:y*h+(Math.random()-.5)*80,vx:.35+Math.random()*1.15,vy:-.3+(Math.random()-.5)*.75,r:.8+Math.random()*3.8,a:.12+Math.random()*.34,t:90+Math.random()*120,c:Math.random()>.76?'#d584b1':'#879b61'})}function draw(now){x+=(tx-x)*.065;y+=(ty-y)*.065;const rect=scene.getBoundingClientRect(),lx=((x*w-rect.left)/rect.width)*100,ly=((y*h-rect.top)/rect.height)*100;living.style.setProperty('--x',lx+'%');living.style.setProperty('--y',ly+'%');lens.style.left=(x*w)+'px';lens.style.top=(y*h)+'px';scene.style.transform=`translate(-50%,-50%) rotateX(${5+(y-.5)*4}deg) rotateY(${(x-.5)*-7}deg) rotateZ(${-4+(x-.5)*1.3}deg)`;puff(now);ctx.clearRect(0,0,w,h);ctx.globalCompositeOperation='lighter';for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy+Math.sin((p.t+i)*.08)*.08;p.vx*=1.006;p.t--;p.a*=.992;if(p.t<0||p.a<.01){particles.splice(i,1);continue}ctx.filter=`blur(${Math.max(.3,p.r*.45)}px)`;ctx.fillStyle=p.c;ctx.globalAlpha=p.a;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.filter='none';ctx.globalAlpha=1;requestAnimationFrame(draw)}if(matchMedia('(prefers-reduced-motion: reduce)').matches){x=tx;y=ty}else requestAnimationFrame(draw)})();
</script></body></html>
