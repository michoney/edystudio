<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Fireworks VR · Particle Garden</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#02030a;color:#cfe9ff;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}
  #info{position:fixed;left:14px;bottom:12px;font-size:12px;letter-spacing:.05em;opacity:.7;z-index:2;pointer-events:none}
  #hint{position:fixed;right:14px;top:12px;font-size:12px;opacity:.8;z-index:2;pointer-events:none}
</style>
</head>
<body>
<div id="hint">🥽 点右上 VR 按钮 · 扳机抓取 · 握把飞行 · 左摇杆移动 · 右摇杆转向</div>
<div id="info">3D Fireworks VR · 花园项目</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { initVRLocomotion, createVRButton } from '../../assets/vr-controls.js';

const MAX = 9000;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02030a);
scene.fog = new THREE.Fog(0x02030a, 30, 90);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 2.5, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(createVRButton(renderer));
const controls = new OrbitControls(camera, renderer.domElement);

const grid = new THREE.GridHelper(40, 20, 0x2a5a7a, 0x14324a);
grid.position.y = -1.5;
scene.add(grid);

// 手柄移动：抓取 / 飞行 / 摇杆（类似 Google Earth VR）
const vr = initVRLocomotion({ renderer, camera, scene, controls });

const positions = new Float32Array(MAX*3);
const colors = new Float32Array(MAX*3);
const vel = new Float32Array(MAX*3);
const life = new Float32Array(MAX);
const maxLife = new Float32Array(MAX);
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
const mat = new THREE.PointsMaterial({ size: 0.09, vertexColors: true, transparent: true, opacity: .95,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true });
const points = new THREE.Points(geo, mat);
scene.add(points);

let cursor = 0, nextFirework = 0;
const TYPES = ['KIKU','BOTAN','KAMURO','SENRIN','STAR_MINE'];
function hsb2rgb(h,s,b){
  h=((h%360)+360)%360; const c=b*s, x=c*(1-Math.abs((h/60)%2-1)), m=b-c;
  let r=0,g=0,bb=0;
  if(h<60){r=c;g=x} else if(h<120){r=x;g=c} else if(h<180){g=c;bb=x}
  else if(h<240){g=x;bb=c} else if(h<300){r=x;bb=c} else {r=c;bb=x}
  return [r+m,g+m,bb+m];
}
function spawn(type){
  const hu = type==='KAMURO'?45:Math.random()*360;
  const n = type==='KIKU'?180 : type==='BOTAN'?320 : type==='SENRIN'?40 : 260;
  const cx = (Math.random()-0.5)*6, cy = Math.random()*4+1.5, cz = (Math.random()-0.5)*6;
  for(let i=0;i<n;i++){
    const idx=cursor*3; cursor=(cursor+1)%MAX;
    const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    const sp=(type==='SENRIN')?0.15:0.5+Math.random()*1.6;
    const vx=sp*Math.sin(ph)*Math.cos(th), vy=sp*Math.cos(ph), vz=sp*Math.sin(ph)*Math.sin(th);
    vel[idx]=vx; vel[idx+1]=vy; vel[idx+2]=vz;
    positions[idx]=cx; positions[idx+1]=cy; positions[idx+2]=cz;
    const [r,g,b]=hsb2rgb(hu+Math.random()*30-15, 0.95, 0.9+Math.random()*0.1);
    colors[idx]=r; colors[idx+1]=g; colors[idx+2]=b;
    life[idx]=1; maxLife[idx]=2.2+Math.random()*1.8;
  }
}
renderer.setAnimationLoop(()=>{
  vr.update();
  const t = performance.now()/1000;
  nextFirework--;
  if(nextFirework<=0){ spawn(TYPES[Math.floor(Math.random()*TYPES.length)]); nextFirework=8+Math.random()*14; }
  for(let i=0;i<MAX;i++){
    if(life[i]<=0) continue;
    life[i]-=0.016;
    const ix=i*3;
    positions[ix]+=vel[ix]; positions[ix+1]+=vel[ix+1]-0.045; positions[ix+2]+=vel[ix+2];
    vel[ix]*=0.985; vel[ix+1]*=0.985; vel[ix+2]*=0.985;
    const k=Math.max(life[i]/maxLife[i],0);
    const r=colors[ix], g=colors[ix+1], b=colors[ix+2];
    colors[ix]=r*k+0.02*(1-k); colors[ix+1]=g*k+0.02*(1-k); colors[ix+2]=b*k+0.02*(1-k);
    if(positions[ix+1]<-1.4){ life[i]=0; }
  }
  geo.attributes.position.needsUpdate=true;
  geo.attributes.color.needsUpdate=true;
  renderer.render(scene,camera);
});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
