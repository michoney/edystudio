<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>树 VR · Arbor LiDAR Tree · Particle Garden</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#02050a;color:#bfe6d0;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}
  #info{position:fixed;left:14px;bottom:12px;font-size:12px;letter-spacing:.05em;opacity:.75;z-index:2;pointer-events:none}
  #hint{position:fixed;right:14px;top:12px;font-size:12px;opacity:.8;z-index:2;pointer-events:none}
</style>
</head>
<body>
<div id="hint">🥽 点右上 VR 按钮进入头显 · 树 VR（Arbor LiDAR 粒子树）</div>
<div id="info">iPhone LiDAR 扫描树 → 粒子呈现 · 数字化树木</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02050a);
scene.fog = new THREE.Fog(0x02050a, 25, 70);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 200);
camera.position.set(3.2, 2.2, 5.2);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));
new OrbitControls(camera, renderer.domElement);

const grid = new THREE.GridHelper(20, 12, 0x1e4a34, 0x0d2b1e);
grid.position.y = -0.01;
scene.add(grid);

// —— 手柄移动（HTC Vive / 谷歌地球式自由飞行） ——
const player = new THREE.Group();
player.add(camera);
scene.add(player);
const UP = new THREE.Vector3(0, 1, 0);
const clock = new THREE.Clock();
const c0 = renderer.xr.getController(0);
const c1 = renderer.xr.getController(1);
function addHand(controller) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.12),
    new THREE.MeshBasicMaterial({ color: 0x8ff0b5 }));
  m.position.set(0, 0, -0.08);
  controller.add(m);
  scene.add(controller);
}
addHand(c0); addHand(c1);
renderer.xr.addEventListener('sessionstart', () => { controls.enabled = false; });
renderer.xr.addEventListener('sessionend', () => { controls.enabled = true; });

function movePlayer() {
  if (!renderer.xr.isPresenting) return;
  const dt = Math.min(clock.getDelta(), 0.1);
  const fwd = new THREE.Vector3();
  camera.getWorldDirection(fwd);
  const right = new THREE.Vector3().crossVectors(fwd, UP).normalize();
  const upv = new THREE.Vector3().crossVectors(right, fwd).normalize();
  const spd = 2.2 * dt;
  const g0 = c0.gamepad, g1 = c1.gamepad;
  if (g0) {
    const x = g0.axes[0] || 0, y = g0.axes[1] || 0;
    player.position.addScaledVector(fwd, -y * spd);
    player.position.addScaledVector(right, x * spd);
  }
  if (g1) {
    player.rotation.y += (g1.axes[0] || 0) * 1.6 * dt;
    player.position.addScaledVector(upv, (g1.axes[1] || 0) * spd);
  }
}

const hint = document.createElement('div');
hint.style.cssText = 'position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:3;font-size:12px;opacity:.85;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:20px;pointer-events:none';
hint.textContent = '左手柄圆盘: 移动 | 右手柄圆盘: 左右转/上下飞';
document.body.appendChild(hint);

// —— 粒子树：主干 + 枝杈（线段） + 叶片粒子 ——
function makeTree() {
  const g = new THREE.Group();
  const branchMat = new THREE.LineBasicMaterial({ color: 0x8a5a33, transparent: true, opacity: .85 });
  const leafMat = new THREE.PointsMaterial({ color: 0x5dd68a, size: 0.09, sizeAttenuation: true,
    transparent: true, opacity: .9, blending: THREE.AdditiveBlending, depthWrite: false });
  const branches = [];
  const leafPos = [];
  const stack = [{ x:0, y:0, z:0, len:2.0, dir:[0,1,0], depth:0 }];
  let guard = 0;
  while (stack.length && guard < 600) {
    guard++;
    const n = stack.pop();
    const { x, y, z, len, dir, depth } = n;
    const scale = Math.pow(0.72, depth);
    const seg = 5;
    let px = x, py = y, pz = z, dx = dir[0], dy = dir[1], dz = dir[2];
    for (let i = 0; i < seg; i++) {
      const s = (i+1)/seg;
      dx += (Math.random()-0.5)*0.5*scale;
      dy += (Math.random()-0.5)*0.4*scale;
      dz += (Math.random()-0.5)*0.5*scale;
      const L = Math.hypot(dx,dy,dz) || 1;
      dx/=L; dy/=L; dz/=L;
      const nx = px + dx*len/seg*0.75, ny = py + dy*len/seg, nz = pz + dz*len/seg;
      const geo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(px,py,pz), new THREE.Vector3(nx,ny,nz) ]);
      const line = new THREE.Line(geo, branchMat);
      line.userData = { base:[px,py,pz], top:[nx,ny,nz], depth };
      g.add(line); branches.push(line);
      px=nx; py=ny; pz=nz;
    }
    if (depth < 5) {
      const children = depth<2 ? 4 : 3;
      for (let c=0;c<children;c++){
        stack.push({ x:px, y:py, z:pz, len:len*0.72, dir:[dx+Math.random()*0.9-0.45, dy+Math.random()*0.5, dz+Math.random()*0.9-0.45], depth:depth+1 });
      }
    }
    for (let k=0;k<14;k++){
      leafPos.push(px + (Math.random()-0.5)*0.5, py + (Math.random()-0.5)*0.5, pz + (Math.random()-0.5)*0.5);
    }
  }
  const leafGeo = new THREE.BufferGeometry();
  leafGeo.setAttribute('position', new THREE.Float32BufferAttribute(leafPos, 3));
  const leaves = new THREE.Points(leafGeo, leafMat);
  g.add(leaves);
  g.userData.branches = branches;
  return g;
}

const tree = makeTree();
scene.add(tree);
const treeTilt = new THREE.Group();
treeTilt.add(tree);
scene.add(treeTilt);

const glow = new THREE.PointLight(0x7fe0a5, 0.7, 20);
glow.position.set(0, 3.5, 1.5);
scene.add(glow);

renderer.setAnimationLoop((tms) => {
  movePlayer();
  const t = tms/1000;
  treeTilt.rotation.y = Math.sin(t*0.08)*0.12;
  tree.rotation.x = Math.sin(t*0.05)*0.03;
  tree.rotation.z = Math.cos(t*0.06)*0.03;
  renderer.render(scene, camera);
});
window.addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
