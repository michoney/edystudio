<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tesla Model Y VR · 3D Product Showcase</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0e1116;color:#dbe4ec;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}
  #info{position:fixed;left:14px;bottom:12px;font-size:12px;letter-spacing:.05em;opacity:.75;z-index:2;pointer-events:none}
  #hint{position:fixed;right:14px;top:12px;font-size:12px;opacity:.8;z-index:2;pointer-events:none}
</style>
</head>
<body>
<div id="hint">🥽 点右上 VR 按钮 · 左手柄移动 · 右手柄转/上下飞</div>
<div id="info">Tesla Model Y · VR 展示（GLB 真车模型）</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1116);
scene.fog = new THREE.Fog(0x0e1116, 20, 60);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 200);
camera.position.set(2.2, 1.4, 3.6);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0);
controls.maxDistance = 12; controls.minDistance = 1.5;

// 地面
const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20),
  new THREE.MeshStandardMaterial({ color: 0x18202b, roughness: .95 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(20, 20, 0x3a4a5a, 0x1a242f);
grid.position.y = 0.001; scene.add(grid);

const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(4, 6, 3); scene.add(light);
scene.add(new THREE.AmbientLight(0x445566, 0.8));
const rim = new THREE.PointLight(0x37f0c0, 1.2, 15); rim.position.set(-3, 2, -2); scene.add(rim);

// 真车 GLB
let car = null;
new GLTFLoader().load('../../tesla-model3/assets/model-y.glb', (gltf) => {
  car = gltf.scene;
  car.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  const box = new THREE.Box3().setFromObject(car);
  const size = box.getSize(new THREE.Vector3());
  const scale = 2.4 / Math.max(size.x, size.y, size.z);
  car.scale.setScalar(scale);
  const c = box.getCenter(new THREE.Vector3());
  car.position.set(-c.x*scale, (-c.y*scale)+0.75, -c.z*scale);
  car.rotation.y = Math.PI;
  scene.add(car);
});

// —— 手柄移动（同树 VR，谷歌地球式） ——
const player = new THREE.Group(); player.add(camera); scene.add(player);
const UP = new THREE.Vector3(0,1,0); const clock = new THREE.Clock();
const c0 = renderer.xr.getController(0), c1 = renderer.xr.getController(1);
function hand(h){ const m=new THREE.Mesh(new THREE.BoxGeometry(.05,.05,.12), new THREE.MeshBasicMaterial({color:0x37f0c0})); m.position.set(0,0,-.08); h.add(m); scene.add(h); }
hand(c0); hand(c1);
renderer.xr.addEventListener('sessionstart', () => { controls.enabled = false; });
renderer.xr.addEventListener('sessionend', () => { controls.enabled = true; });
function move(){
  if (!renderer.xr.isPresenting) return;
  const dt = Math.min(clock.getDelta(), .1);
  const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd);
  const right = new THREE.Vector3().crossVectors(fwd, UP).normalize();
  const upv = new THREE.Vector3().crossVectors(right, fwd).normalize();
  const spd = 2.2*dt;
  const g0 = c0.gamepad, g1 = c1.gamepad;
  if (g0){ player.position.addScaledVector(fwd, -(g0.axes[1]||0)*spd); player.position.addScaledVector(right, (g0.axes[0]||0)*spd); }
  if (g1){ player.rotation.y += (g1.axes[0]||0)*1.6*dt; player.position.addScaledVector(upv, (g1.axes[1]||0)*spd); }
}

renderer.setAnimationLoop((tms) => {
  move();
  const t = tms/1000;
  if (car && !renderer.xr.isPresenting) car.rotation.y += 0.0015;
  renderer.render(scene, camera);
});
window.addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
