<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>花园 VR · Particle Garden VR</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#04070d;color:#cfe9ff;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}
  #hint{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:3;font-size:12px;opacity:.85;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:20px;pointer-events:none}
  #modes{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:3;display:flex;gap:8px;pointer-events:auto}
  #modes button{background:rgba(4,7,13,.6);border:1px solid rgba(120,200,255,.35);color:#cfe9ff;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:12px}
  #modes button.active{background:rgba(120,200,255,.16);border-color:#78c8ff;color:#e6f6ff}
</style>
</head>
<body>
<div id="hint">🥽 点右上 VR 按钮 · 左手柄移动 · 右手柄转/上下飞 · 左圆盘按一下切造型</div>
<div id="modes"><button data-m="0" class="active">花朵</button><button data-m="1">爱心</button><button data-m="2">土星</button><button data-m="3">烟花</button></div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04070d);
scene.fog = new THREE.Fog(0x04070d, 25, 70);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 1.6, 6);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.minDistance = 2; controls.maxDistance = 14;

// 手柄移动
const player = new THREE.Group(); player.add(camera); scene.add(player);
const UP = new THREE.Vector3(0,1,0); const clock = new THREE.Clock();
const c0 = renderer.xr.getController(0), c1 = renderer.xr.getController(1);
function hand(h){ const m=new THREE.Mesh(new THREE.BoxGeometry(.05,.05,.12), new THREE.MeshBasicMaterial({color:0x78c8ff})); m.position.set(0,0,-.08); h.add(m); scene.add(h); }
hand(c0); hand(c1);
renderer.xr.addEventListener('sessionstart', () => { controls.enabled = false; });
renderer.xr.addEventListener('sessionend', () => { controls.enabled = true; });
let mode = 0;
c0.addEventListener('selectstart', () => { mode = (mode+1)%4; syncMode(); });
function move(){
  if (!renderer.xr.isPresenting) return;
  const dt = Math.min(clock.getDelta(), .1);
  const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd);
  const right = new THREE.Vector3().crossVectors(fwd, UP).normalize();
  const upv = new THREE.Vector3().crossVectors(right, fwd).normalize();
  const spd = 2.2*dt;
  const g0 = c0.gamepad, g1 = c1.gamepad;
  if (g0){ player.position.addScaledVector(fwd, -(g0.axes[1]||0)*spd); player.position.addScaledVector(right, (g0.axes[0]||0)*spd); }
  if (g1){ player.rotation.y += (g1.axes[0]||0)*1.6*dt; player.position.addScaledVector(upv, (g1.axes[1]||0)*spd); }
}

// 粒子花园：12000 粒子在多个造型间聚散
const COUNT = 12000;
const shapes = [
  // 0 花朵：花蕊 + 花瓣 + 光晕
  (i) => { const a=(i/COUNT)*Math.PI*2; const ring=Math.floor(Math.random()*3);
    const r = ring===0?0.15: ring===1?0.6+Math.random()*0.35 : 0.9+Math.random()*0.3;
    const petals = ring===1? 6 : ring===2? 5 : 0;
    const ang = a + (petals? Math.floor(Math.random()*petals)*(Math.PI*2/petals) : 0);
    return [Math.cos(ang)*r, Math.sin(ang)*r*0.9 + (ring===2?0.1:0), (Math.random()-0.5)*0.15]; },
  // 1 爱心
  (i) => { const t=(i/COUNT)*Math.PI*2; const s=Math.random();
    const x=16*Math.pow(Math.sin(t),3), y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
    return [x/9+s*0.06, y/9+s*0.06, (Math.random()-0.5)*0.3]; },
  // 2 土星：球体 + 环
  (i) => { const a=(i/COUNT)*Math.PI*2, b=Math.acos(2*Math.random()-1);
    const ring = Math.random()<0.38;
    if (ring){ const rr=1.6+Math.random()*0.5; return [Math.cos(a)*rr, (Math.random()-0.5)*0.06, Math.sin(a)*rr]; }
    const r=Math.cbrt(Math.random())*0.95;
    return [Math.sin(b)*Math.cos(a)*r, Math.cos(b)*r*0.9, Math.sin(b)*Math.sin(a)*r]; },
  // 3 烟花：放射
  (i) => { const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1), r=Math.pow(Math.random(),0.4)*2.4;
    return [r*Math.sin(ph)*Math.cos(th), r*Math.cos(ph)*0.8, r*Math.sin(ph)*Math.sin(th)]; },
];
const pos = new Float32Array(COUNT*3);
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const colors = new Float32Array(COUNT*3);
geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
const palette = [new THREE.Color(0xff7eb3), new THREE.Color(0xffd166), new THREE.Color(0x78c8ff), new THREE.Color(0x9bffb0)];
for (let i=0;i<COUNT;i++){ const c=palette[i%4]; colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b; }
const points = new THREE.Points(geo, new THREE.PointsMaterial({size:0.045,vertexColors:true,transparent:true,opacity:0.95,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true}));
scene.add(points);

// 混合目标
let targets = shapes.map(fn => { const t = new Float32Array(COUNT*3); for (let i=0;i<COUNT;i++){ const p=fn(i); t[i*3]=p[0]; t[i*3+1]=p[1]; t[i*3+2]=p[2]; } return t; });
let current = targets[0].slice();

function syncMode(){ document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('active', +b.dataset.m===mode)); }
document.querySelectorAll('#modes button').forEach(b=>b.addEventListener('click',()=>{ mode=+b.dataset.m; syncMode(); }));

const animClock = new THREE.Clock();
renderer.setAnimationLoop(()=>{
  move();
  const t = animClock.getElapsedTime();
  const target = targets[mode];
  const k = 0.06;
  for (let i=0;i<COUNT*3;i++) current[i] += (target[i]-current[i])*k;
  // 轻微呼吸/旋转感
  const ca = Math.cos(t*0.2), sa = Math.sin(t*0.2);
  for (let i=0;i<COUNT;i++){
    const x=current[i*3], y=current[i*3+1], z=current[i*3+2];
    pos[i*3] = x*ca - z*sa;
    pos[i*3+1] = y + Math.sin(t*1.5 + i)*0.01;
    pos[i*3+2] = x*sa + z*ca;
  }
  geo.attributes.position.needsUpdate = true;
  controls.update();
  renderer.render(scene, camera);
});
window.addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
