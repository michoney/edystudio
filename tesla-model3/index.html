<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tesla Model Y · 3D Product Showcase</title>
<style>
  :root {
    --bg: #0e1116; --panel: rgba(20,26,34,.84); --line: rgba(255,255,255,.09);
    --txt: #dbe4ec; --txt-dim: #8b98a5; --accent: #ff8a2a; --accent2: #37f0c0;
    --blue: #7fb3d5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--txt); }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  .panel { position: fixed; z-index: 10; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    padding: 14px 16px; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  .panel h2 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: .5px; }
  .panel .sub { margin: 0; font-size: 11px; color: var(--txt-dim); }

  #title { top: 16px; left: 16px; max-width: 320px; }
  #title .tag { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 20px;
    background: rgba(55,240,192,.14); color: var(--accent2); border: 1px solid rgba(55,240,192,.3); margin-bottom: 6px; }

  #nav { top: 16px; right: 16px; width: 232px; }
  #nav .branch { display: flex; align-items: center; gap: 8px; padding: 8px 9px; margin-top: 4px;
    border-radius: 9px; cursor: pointer; border: 1px solid transparent; transition: background .15s, border .15s; }
  #nav .branch:hover { background: rgba(255,255,255,.05); }
  #nav .branch.sel { background: rgba(255,138,42,.12); border-color: rgba(255,138,42,.4); }
  #nav .branch .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  #nav .branch .nm { flex: 1; font-size: 13px; }
  #nav .branch .st { font-size: 10px; padding: 1px 7px; border-radius: 20px; }
  #nav .branch .st.built { background: rgba(55,240,192,.15); color: var(--accent2); }
  #nav .branch .st.wip { background: rgba(255,255,255,.08); color: var(--txt-dim); }

  #ctrl { bottom: 16px; right: 16px; }
  #ctrl .btnrow { display: flex; gap: 8px; flex-wrap: wrap; width: 232px; }
  button { flex: 1; min-width: 70px; padding: 8px 10px; border-radius: 9px; cursor: pointer;
    background: rgba(255,255,255,.06); color: var(--txt); border: 1px solid var(--line);
    font-size: 12.5px; font-family: inherit; transition: background .15s, border .15s, transform .05s; }
  button:hover { background: rgba(255,255,255,.12); }
  button:active { transform: scale(.96); }
  button.on { background: rgba(55,240,192,.16); border-color: rgba(55,240,192,.5); color: var(--accent2); }

  #info { left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 11; display: flex; align-items: center;
    gap: 12px; padding: 8px 10px 8px 16px; }
  #info b { color: var(--accent); }
  #info .st { font-size: 11px; color: var(--txt-dim); }
  #info button { display: none; background: rgba(255,138,42,.16); border-color: rgba(255,138,42,.5); color: var(--accent); }
  #info button.show { display: block; }

  #hint { position: fixed; bottom: 16px; left: 16px; z-index: 9; font-size: 11px; color: var(--txt-dim); line-height: 1.7; opacity: .85; }

  /* —— 20 秒自动进入后桥电驱 —— */
  #autonext { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 20;
    display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-radius: 30px;
    background: rgba(20,26,34,.85); border: 1px solid rgba(255,138,42,.4); backdrop-filter: blur(8px); }
  #autonext .cd { font-size: 15px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  #autonext .lb { font-size: 12px; color: var(--txt); }
  #autonext button { padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer;
    background: rgba(255,138,42,.16); border: 1px solid rgba(255,138,42,.5); color: var(--accent); }
  /* 自动进入开关 */
  #autonext .sw { position: relative; width: 40px; height: 22px; flex: 0 0 auto; cursor: pointer; }
  #autonext .sw input { position: absolute; opacity: 0; width: 0; height: 0; }
  #autonext .sw .tk { position: absolute; inset: 0; border-radius: 22px; background: rgba(255,255,255,.12);
    border: 1px solid var(--line); transition: background .2s, border-color .2s; }
  #autonext .sw .tk::before { content: ""; position: absolute; left: 3px; top: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: #889; transition: transform .2s, background .2s; }
  #autonext .sw input:checked + .tk { background: rgba(55,240,192,.2); border-color: rgba(55,240,192,.5); }
  #autonext .sw input:checked + .tk::before { transform: translateX(18px); background: var(--accent2); }

  /* —— 竖屏提示（自动横屏兜底）—— */
  #rotate { position: fixed; inset: 0; z-index: 40; background: rgba(10,14,18,.96); display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px; }
  #rotate.show { display: flex; }
  #rotate .ic { font-size: 58px; animation: rotspin 1.6s ease-in-out infinite; }
  #rotate h3 { margin: 0; font-size: 18px; color: var(--txt); }
  #rotate p { margin: 0; font-size: 13px; color: var(--txt-dim); }
  @keyframes rotspin { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }

  /* —— 手机窄屏适配 —— */
  @media (max-width: 820px) {
    #nav, #hint, #info { display: none; }
    #title { max-width: 200px; padding: 10px 12px; }
    #title h2 { font-size: 13px; }
    #title .sub { font-size: 10px; }
    #ctrl { bottom: 66px; right: 12px; }
    #autonext { top: auto; bottom: 14px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="title" class="panel">
  <span class="tag">TESLA · 3D PRODUCT SHOWCASE</span>
  <h2>Model Y</h2>
  <p class="sub">Whole vehicle at root · each subsystem an exploded view. Tap to enter.</p>
</div>

<div id="nav" class="panel">
  <h2>子系统 · 分支</h2>
  <p class="sub" style="margin-bottom:2px">● 已建模　○ 待建模</p>
  <div id="branchList"></div>
</div>

<div id="ctrl" class="panel">
  <div class="btnrow">
    <button id="btnXray">全透视</button>
    <button id="btnLabel">标注</button>
    <button id="btnSpin">旋转</button>
    <button id="btnLift">掀开车壳</button>
  </div>
</div>

<div id="info" class="panel">
  <span>选中：<b id="selname">无</b></span>
  <span class="st" id="selstatus"></span>
  <button id="btnEnter">进入详细视图 →</button>
</div>

<div id="autonext">
  <span class="cd" id="autonext-cd">20</span><span class="lb">秒后自动进入后桥电驱</span>
  <label class="sw" title="自动进入开关"><input type="checkbox" id="autonext-toggle" checked><span class="tk"></span></label>
  <button id="autonext-skip">立即进入 →</button>
</div>

<div id="rotate">
  <div class="ic">📱</div>
  <h3>请旋转手机至横屏</h3>
  <p>横屏可获得最佳观看体验</p>
</div>

<div id="hint">🖱 左键旋转 · 滚轮缩放 · 右键平移<br>点击 3D 区域或右侧列表选中分支</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { initVRLocomotion, createVRButton } from '../assets/vr-controls.js';

// ---------- 场景 ----------
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0e1116, 1500, 5200);
const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 1, 12000);
camera.position.set(3800, 2100, 4500);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.xr.enabled = true;
app.appendChild(renderer.domElement);
document.body.appendChild(createVRButton(renderer));

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
app.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 460, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 900;
controls.maxDistance = 9000;

const vr = initVRLocomotion({ renderer, camera, scene, controls });

scene.add(new THREE.HemisphereLight(0xcfd8e0, 0x1a2027, 0.8));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(2200, 3200, 1800);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -4000; key.shadow.camera.right = 4000;
key.shadow.camera.top = 4000; key.shadow.camera.bottom = -4000;
key.shadow.camera.far = 9000;
scene.add(key);
const fill = new THREE.DirectionalLight(0x7fb3d5, 0.7);
fill.position.set(-2000, 900, -2000);
scene.add(fill);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(9000, 9000),
  new THREE.MeshStandardMaterial({ color: 0x12161c, roughness: 0.95, metalness: 0.1 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = 0; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(5000, 50, 0x2a3440, 0x1a222b); grid.position.y = 1; scene.add(grid);

// ---------- 材质 ----------
const matReg = [];
function reg(m, b) { matReg.push({ mat: m, base: b }); return m; }
function setXray(on) {
  for (const { mat, base } of matReg) {
    mat.transparent = true; mat.depthWrite = !on; mat.opacity = on ? base * 0.3 : base; mat.needsUpdate = true;
  }
}
const M = {
  body: reg(new THREE.MeshStandardMaterial({ color: 0xe8eef2, metalness: 0.55, roughness: 0.35, transparent: true, opacity: 0.55 }), 0.55),
  bodyEdge: new THREE.LineBasicMaterial({ color: 0xdfeaf2, transparent: true, opacity: 0.6 }),
  glass: reg(new THREE.MeshStandardMaterial({ color: 0x1c2a33, metalness: 0.6, roughness: 0.15, transparent: true, opacity: 0.55 }), 0.55),
  tire: reg(new THREE.MeshStandardMaterial({ color: 0x15181c, metalness: 0.1, roughness: 0.85 }), 1.0),
  rim: reg(new THREE.MeshStandardMaterial({ color: 0x9aa4ab, metalness: 0.9, roughness: 0.3 }), 1.0),
  region: reg(new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.2, roughness: 0.5, transparent: true, opacity: 0.30 }), 0.30),
  regionEdge: new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55 }),
};
const leaderMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5, depthTest: false });
const C_BLUE = '#7fb3d5', C_ORANGE = '#ff8a2a', C_TEAL = '#37f0c0';

// ---------- 分支定义 ----------
const BRANCHES = [
  { id: 'body',    name: '车身外观', en: 'Body Shell',        color: C_BLUE,   status: 'wip',   note: '实车 GLB · 点「掀开车壳」或「全透视」看内部' },
  { id: 'drive',   name: '后桥电驱', en: 'Rear Drive Unit',   color: C_ORANGE, status: 'built', link: 'views/drive-unit/' },
  { id: 'battery', name: '电池包',   en: 'Battery Pack',      color: C_TEAL,   status: 'built', link: 'views/battery/' },
  { id: 'printer', name: '3D 打印机', en: '3D Printer',      color: C_ORANGE, status: 'built', link: 'views/printer/' },
  { id: 'front',   name: '前悬挂/转向', en: 'Front Suspension', color: C_BLUE, status: 'wip',   note: '待建模' },
  { id: 'wheels',  name: '车轮',     en: 'Wheels',            color: C_TEAL,   status: 'wip',   note: '待建模' },
];
const byId = Object.fromEntries(BRANCHES.map(b => [b.id, b]));
const pickMeshes = [];
const meshToBranch = new Map();

// ============================================================
//  车身大壳（侧视轮廓挤出）
// ============================================================
const bodyGroup = new THREE.Group();
scene.add(bodyGroup);

function profileShape(pts) {
  const curve = new THREE.CatmullRomCurve3(pts.map(([x, y]) => new THREE.Vector3(x, y, 0)));
  const s = new THREE.Shape();
  curve.getPoints(90).forEach((p, i) => i === 0 ? s.moveTo(p.x, p.y) : s.lineTo(p.x, p.y));
  s.closePath();
  return s;
}
function buildBody() {
  // 下车身（全宽 1849，至腰线 Y~880）
  const lower = [
    [2347, 330], [2315, 500], [2270, 700], [2200, 800], [1500, 840], [820, 880],
    [-1100, 880], [-1600, 885], [-2200, 900], [-2280, 640], [-2347, 330]
  ];
  const lowerGeo = new THREE.ExtrudeGeometry(profileShape(lower), { depth: 1849, bevelEnabled: false });
  lowerGeo.translate(0, 0, -924.5);
  const lowerMesh = new THREE.Mesh(lowerGeo, M.body);
  lowerMesh.castShadow = true;
  bodyGroup.add(lowerMesh);
  bodyGroup.add(new THREE.LineSegments(new THREE.EdgesGeometry(lowerGeo, 12), M.bodyEdge));

  // 座舱/温室（窄 1450，腰线以上，收腰）
  const cabin = [
    [820, 880], [360, 1300], [250, 1400], [-380, 1400], [-720, 1335], [-1500, 955], [-1610, 880]
  ];
  const cabinGeo = new THREE.ExtrudeGeometry(profileShape(cabin), { depth: 1450, bevelEnabled: false });
  cabinGeo.translate(0, 4, -725);
  const cabinMesh = new THREE.Mesh(cabinGeo, M.body);
  cabinMesh.castShadow = true;
  bodyGroup.add(cabinMesh);
  bodyGroup.add(new THREE.LineSegments(new THREE.EdgesGeometry(cabinGeo, 12), M.bodyEdge));

  // 前挡风玻璃（座舱前斜面，宽 1450）
  const ws = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1450), M.glass);
  const p0 = new THREE.Vector3(820, 880, 0), p1 = new THREE.Vector3(250, 1400, 0);
  const mid = p0.clone().add(p1).multiplyScalar(0.5);
  ws.scale.set(p0.distanceTo(p1), 50, 1);
  ws.position.copy(mid);
  ws.rotation.z = Math.atan2(p1.y - p0.y, p1.x - p0.x);
  bodyGroup.add(ws);

  // 后挡风（快背，宽 1450）
  const rg = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1450), M.glass);
  const q0 = new THREE.Vector3(-380, 1400, 0), q1 = new THREE.Vector3(-1610, 880, 0);
  const mid2 = q0.clone().add(q1).multiplyScalar(0.5);
  rg.scale.set(q0.distanceTo(q1), 50, 1);
  rg.position.copy(mid2);
  rg.rotation.z = Math.atan2(q1.y - q0.y, q1.x - q0.x);
  bodyGroup.add(rg);

  // 侧窗（左右，座舱宽度）
  for (const sz of [-1, 1]) {
    const sg = new THREE.Mesh(new THREE.BoxGeometry(1180, 440, 16), M.glass);
    sg.position.set(-60, 1130, sz * 716);
    bodyGroup.add(sg);
  }

  // 前大灯（左右）
  const hl = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xdff4ff, emissiveIntensity: 1.6, metalness: 0.1, roughness: 0.3 });
  for (const sz of [-1, 1]) {
    const light = new THREE.Mesh(new THREE.BoxGeometry(18, 32, 400), hl);
    light.position.set(2290, 660, sz * 540);
    bodyGroup.add(light);
  }
  // 贯穿式尾灯
  const tl = new THREE.MeshStandardMaterial({ color: 0x2a0000, emissive: 0xff2233, emissiveIntensity: 1.8, metalness: 0.2, roughness: 0.4 });
  const tail = new THREE.Mesh(new THREE.BoxGeometry(16, 28, 1500), tl);
  tail.position.set(-2290, 640, 0);
  bodyGroup.add(tail);

  // 后视镜
  const mirrorMat = new THREE.MeshStandardMaterial({ color: 0x11151a, metalness: 0.5, roughness: 0.4 });
  for (const sz of [-1, 1]) {
    const stalk = new THREE.Mesh(new THREE.BoxGeometry(60, 16, 16), mirrorMat);
    stalk.position.set(340, 990, sz * 920);
    bodyGroup.add(stalk);
    const head = new THREE.Mesh(new THREE.BoxGeometry(120, 64, 44), mirrorMat);
    head.position.set(370, 1000, sz * 970);
    bodyGroup.add(head);
  }

  // 车门缝隙（下车身两侧）
  const seamMat = new THREE.MeshBasicMaterial({ color: 0x0a0d10, transparent: true, opacity: 0.7 });
  for (const gx of [830, 40, -820]) for (const sz of [-1, 1]) {
    const seam = new THREE.Mesh(new THREE.BoxGeometry(4, 520, 24), seamMat);
    seam.position.set(gx, 620, sz * 920);
    bodyGroup.add(seam);
  }

  // 轮拱（暗色井）
  const archMat = new THREE.MeshStandardMaterial({ color: 0x0c0f12, roughness: 0.9 });
  for (const ax of [1350, -1350]) for (const az of [770, -770]) {
    const arch = new THREE.Mesh(new THREE.CylinderGeometry(360, 360, 230, 40), archMat);
    arch.rotation.x = Math.PI / 2;
    arch.position.set(ax, 300, az);
    bodyGroup.add(arch);
  }
}
buildBody();

// ============================================================
//  真实车身 GLB（assets/model-y.glb，经本地服务器加载；失败则回退程序化车身）
// ============================================================
const proceduralBodyMeshes = [...bodyGroup.children]; // 程序化车壳，加载成功后被隐藏

function fitModel(model) {
  // 1) 摆正：若竖直(Y)是最大轴，说明车身竖起来了，绕 X 转 -90° 放平
  let box = new THREE.Box3().setFromObject(model);
  let s = box.getSize(new THREE.Vector3());
  if (s.y > s.x && s.y > s.z) model.rotation.x = -Math.PI / 2;
  // 2) 长度归到 X 轴
  box = new THREE.Box3().setFromObject(model);
  s = box.getSize(new THREE.Vector3());
  if (s.z > s.x) model.rotation.y = Math.PI / 2;
  // 3) 按 Model Y 车长 4751mm 统一缩放（模型为 1:4 比例，米制单位）
  box = new THREE.Box3().setFromObject(model);
  s = box.getSize(new THREE.Vector3());
  model.scale.setScalar(4694 / Math.max(s.x, s.z));
  // 4) 落地 + XZ 居中
  box = new THREE.Box3().setFromObject(model);
  const c = box.getCenter(new THREE.Vector3());
  model.position.x -= c.x;
  model.position.z -= c.z;
  model.position.y -= box.min.y;
  model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
}

const gltfLoader = new GLTFLoader();
gltfLoader.load('assets/model-y.glb',
  (gltf) => {
    fitModel(gltf.scene);
    // 真实车身材质也注册进 X-Ray，让「全透视」按钮同样作用于它
    gltf.scene.traverse(o => {
      if (o.isMesh && o.material) {
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach(m => reg(m, m.transparent ? m.opacity : 1));
      }
    });
    bodyGroup.add(gltf.scene);
    proceduralBodyMeshes.forEach(c => c.visible = false);
    console.log('✅ 已加载真实 Model Y 车身 (assets/model-y.glb)');
  },
  undefined,
  () => { console.log('ℹ️ 未找到 assets/model-y.glb，回退程序化车身'); }
);

// ============================================================
//  车轮 ×4
// ============================================================
const WHEEL_Y = 300, WHEEL_R = 300, AXLE_X = 1350, AXLE_Z = 770;
function buildWheel(x, z) {
  const g = new THREE.Group();
  const tire = new THREE.Mesh(new THREE.CylinderGeometry(WHEEL_R, WHEEL_R, 220, 40), M.tire);
  tire.rotation.x = Math.PI / 2; tire.castShadow = true;
  g.add(tire);
  const rim = new THREE.Mesh(new THREE.CylinderGeometry(180, 180, 224, 24), M.rim);
  rim.rotation.x = Math.PI / 2;
  g.add(rim);
  for (let i = 0; i < 5; i++) {
    const spoke = new THREE.Mesh(new THREE.BoxGeometry(224, 34, 300), M.rim);
    spoke.rotation.z = i * Math.PI / 5;
    g.add(spoke);
  }
  g.position.set(x, WHEEL_Y, z);
  scene.add(g);
  g.children.forEach(c => { pickMeshes.push(c); meshToBranch.set(c, byId.wheels); });
  return g;
}
buildWheel(AXLE_X, AXLE_Z); buildWheel(AXLE_X, -AXLE_Z);
buildWheel(-AXLE_X, AXLE_Z); buildWheel(-AXLE_X, -AXLE_Z);

// ============================================================
//  分支区域（可点选 + 标注）
// ============================================================
function label(parent, text, color, anchor, offset) {
  const from = anchor.clone(), to = anchor.clone().add(offset);
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([from, to]), leaderMat);
  parent.add(line);
  const div = document.createElement('div');
  div.textContent = text;
  Object.assign(div.style, { color, fontSize: '13px', fontWeight: '600', whiteSpace: 'nowrap',
    textShadow: '0 1px 6px rgba(0,0,0,.9)', background: 'rgba(10,14,18,.6)',
    padding: '3px 10px', borderRadius: '20px', border: `1px solid ${color}66`, letterSpacing: '.5px' });
  const obj = new CSS2DObject(div); obj.position.copy(to); parent.add(obj);
}

function region(branchId, size, pos, color) {
  const b = byId[branchId];
  const g = new THREE.Group();
  const box = new THREE.Mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), M.region);
  box.material = new THREE.MeshStandardMaterial({ color: new THREE.Color(color), metalness: 0.2, roughness: 0.5, transparent: true, opacity: 0.26, depthWrite: false });
  matReg.push({ mat: box.material, base: 0.26 });
  g.add(box);
  const edge = new THREE.LineSegments(new THREE.EdgesGeometry(box.geometry), new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.6 }));
  g.add(edge);
  g.position.copy(pos);
  scene.add(g);
  pickMeshes.push(box); meshToBranch.set(box, b);
  label(g, `${b.name} ${b.en}`, color, new THREE.Vector3(0, size[1] / 2 + 30, 0), new THREE.Vector3(0, 60, 0));
  return g;
}

// 后桥电驱（后轴）
region('drive', [760, 360, 540], new THREE.Vector3(-1350, 400, 0), C_ORANGE);
// 前悬挂（前轴）
region('front', [760, 300, 540], new THREE.Vector3(1350, 360, 0), C_BLUE);
// 电池包（车底）
region('battery', [2200, 150, 820], new THREE.Vector3(0, 205, 0), C_TEAL);

// 车身标注
label(bodyGroup, '车身外观 Body Shell', C_BLUE, new THREE.Vector3(0, 1385, 0), new THREE.Vector3(0, 120, 0));

// ============================================================
//  分支导航列表
// ============================================================
const branchListEl = document.getElementById('branchList');
for (const b of BRANCHES) {
  const row = document.createElement('div');
  row.className = 'branch'; row.dataset.id = b.id;
  row.innerHTML = `<span class="dot" style="background:${b.color}"></span>
    <span class="nm">${b.name}</span>
    <span class="st ${b.status}">${b.status === 'built' ? '● 已建模' : '○ 待建模'}</span>`;
  row.addEventListener('click', () => selectBranch(b.id));
  branchListEl.appendChild(row);
}

// ============================================================
//  选中 / 拾取
// ============================================================
let selected = null, selBox = null;
const infoName = document.getElementById('selname');
const infoStatus = document.getElementById('selstatus');
const infoEnter = document.getElementById('btnEnter');

function selectBranch(id) {
  selected = id ? byId[id] : null;
  if (selBox) { scene.remove(selBox); selBox = null; }
  document.querySelectorAll('#branchList .branch').forEach(r => r.classList.toggle('sel', selected && r.dataset.id === id));
  infoName.textContent = selected ? selected.name : '无';
  infoStatus.textContent = selected ? (selected.status === 'built' ? '已建模，可进入' : (selected.note || '待建模')) : '';
  infoEnter.classList.toggle('show', !!(selected && selected.link));
  if (selected && id !== 'body') {
    // 高亮对应的区域（找该分支的可拾取网格包围盒）
    const meshes = pickMeshes.filter(m => meshToBranch.get(m)?.id === id);
    if (meshes.length) {
      const box = new THREE.Box3().setFromObject(new THREE.Group());
      // 用这些网格的合并包围盒
      meshes.forEach(m => m.updateWorldMatrix(true, false));
      const tmp = new THREE.Box3();
      meshes.forEach(m => tmp.setFromObject(m));
      // 简化：直接用第一个网格的包围盒
      selBox = new THREE.BoxHelper(meshes[0], 0xff8a2a);
      selBox.material.depthTest = false;
      scene.add(selBox);
    }
  }
}
infoEnter.addEventListener('click', () => { if (selected && selected.link) location.href = selected.link; });

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', (e) => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickMeshes, false);
  selectBranch(hits.length ? meshToBranch.get(hits[0].object).id : null);
});

// ============================================================
//  控制
// ============================================================
let xray = false, labelsOn = true, autoRotate = false, lifted = false;
const btnXray = document.getElementById('btnXray');
btnXray.addEventListener('click', () => { xray = !xray; setXray(xray); btnXray.classList.toggle('on', xray); });
const btnLabel = document.getElementById('btnLabel');
btnLabel.addEventListener('click', () => {
  labelsOn = !labelsOn; btnLabel.classList.toggle('on', !labelsOn);
  labelRenderer.domElement.style.display = labelsOn ? 'block' : 'none';
  leaderMat.visible = labelsOn;
});
const btnSpin = document.getElementById('btnSpin');
btnSpin.addEventListener('click', () => {
  autoRotate = !autoRotate; controls.autoRotate = autoRotate; controls.autoRotateSpeed = 0.7;
  btnSpin.classList.toggle('on', autoRotate);
});
const btnLift = document.getElementById('btnLift');
btnLift.addEventListener('click', () => { lifted = !lifted; btnLift.classList.toggle('on', lifted); });

// ============================================================
//  动画
// ============================================================
const clock = new THREE.Clock();
let bodyY = 0;
function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const targetY = lifted ? 950 : 0;
  bodyY += (targetY - bodyY) * 0.08;
  bodyGroup.position.y = bodyY;
  if (selBox) selBox.update();
  vr.update();
  controls.update();
  renderer.render(scene, camera);
  if (!renderer.xr.isPresenting) labelRenderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
});
// —— 自动进入后桥电驱（仅首次进入 + 开关可控）——
const NEXT_PAGE = 'views/drive-unit/';
const K_VISITED = 'm3y_visited';
const K_AUTO = 'm3y_autonext';
const cdEl = document.getElementById('autonext-cd');
const lbEl = document.querySelector('#autonext .lb');
const autoToggle = document.getElementById('autonext-toggle');

let autoNext = localStorage.getItem(K_AUTO) !== '0';   // 默认开启
const visited = localStorage.getItem(K_VISITED) === '1';
let sec = 20, timer = null;

function startCountdown() {
  stopCountdown();
  sec = 20;
  cdEl.textContent = sec;
  lbEl.textContent = '秒后自动进入后桥电驱';
  timer = setInterval(() => {
    sec--;
    if (sec <= 0) { stopCountdown(); location.href = NEXT_PAGE; return; }
    cdEl.textContent = sec;
  }, 1000);
}
function stopCountdown() {
  if (timer) { clearInterval(timer); timer = null; }
  cdEl.textContent = '—';
  lbEl.textContent = '自动进入已关闭';
}

autoToggle.checked = autoNext;
autoToggle.addEventListener('change', () => {
  autoNext = autoToggle.checked;
  localStorage.setItem(K_AUTO, autoNext ? '1' : '0');
  if (autoNext) startCountdown(); else stopCountdown();
});
document.getElementById('autonext-skip').addEventListener('click', () => location.href = NEXT_PAGE);

// 首次进入（开关开启）→ 自动倒计时；否则显示关闭态
if (autoNext && !visited) startCountdown(); else stopCountdown();
localStorage.setItem(K_VISITED, '1');

// —— 自动横屏：优先锁 orientation，iOS 不支持则用竖屏提示兜底 ——
function tryLandscape() {
  try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
  try { if (document.documentElement.requestFullscreen && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
}
renderer.domElement.addEventListener('pointerdown', tryLandscape, { once: true });
function orientCheck() {
  const phone = Math.min(innerWidth, innerHeight) < 820;
  document.getElementById('rotate').classList.toggle('show', phone && innerHeight > innerWidth);
}
orientCheck();
addEventListener('resize', orientCheck);
</script>
</body>
