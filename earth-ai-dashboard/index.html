<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Earth AI Command Center</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body{
    overflow:hidden;
    background:#000;
    font-family:monospace;
    color:#00eaff;
    width:100vw;
    height:100vh;
    position:relative;
}

#hud{
    position:absolute;
    z-index:10;
    background:rgba(0,20,40,.45);
    border:1px solid #00eaff;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    box-shadow:0 0 15px rgba(0,102,255,.3);
}

/* PC 版 - 左上角 */
@media (orientation: landscape) and (min-width: 768px) {
    #hud{
        top:20px;
        left:20px;
        padding:16px 20px;
        width:260px;
        border-radius:12px;
    }
    .title{ font-size:20px; }
    .subtitle{ font-size:11px; }
    .data{ font-size:13px; }
}

/* 手机竖屏版 - 底部横条 */
@media (orientation: portrait), (max-width: 767px) {
    #hud{
        bottom:0;
        left:0;
        right:0;
        width:100%;
        padding:12px 16px 20px;
        border-radius:16px 16px 0 0;
        border-width:1px 0 0 0;
        box-shadow:0 -5px 20px rgba(0,102,255,.3);
    }
    .title{ font-size:16px; letter-spacing:2px; }
    .subtitle{ font-size:10px; }
    .data{
        display:flex;
        flex-wrap:wrap;
        gap:4px 12px;
        margin-top:8px;
        font-size:12px;
    }
    .data br{ display:none; }
}

.title{
    letter-spacing:3px;
}
.subtitle{
    color:#6ecbff;
    opacity:.7;
}
hr{
    border:none;
    border-top:1px solid rgba(0,234,255,.3);
    margin:8px 0;
}
.data{
    line-height:1.8;
    color:white;
}
.data span.label{
    color:#6ecbff;
}
#status{
    color:#00ff88;
}
#vr-hint{
    position:absolute;
    z-index:10;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    color:#00eaff;
    font-size:12px;
    letter-spacing:.08em;
    text-align:center;
    opacity:.85;
    pointer-events:none;
    text-shadow:0 0 10px rgba(0,234,255,.8);
}
</style>
</head>
<body>

<div id="hud">
<div class="title">🌍 EARTH AI</div>
<div class="subtitle">GLOBAL MONITORING SYSTEM</div>
<hr>
<div class="data">
<span><span class="label">LOC:</span> PACIFIC OCEAN</span>
<span><span class="label">TEMP:</span> <span id="temp">26°C</span></span>
<span><span class="label">CLOUD:</span> 68%</span>
<span><span class="label">WIND:</span> 12 km/h</span>
<span><span class="label">SAT:</span> ONLINE</span>
<span><span class="label">AI:</span> <span id="status">CONNECTED</span></span>
</div>
</div>
<div id="vr-hint">扳机: 抓取拖动世界 · 握把: 向手柄方向飞行 · 左摇杆: 移动 · 右摇杆: 转向</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { initVRLocomotion, createVRButton } from '../assets/vr-controls.js';

const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
const dpr = Math.min(window.devicePixelRatio, 2);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = isMobile ? 3.5 : 3;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(dpr);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(createVRButton(renderer));

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableZoom = true;
controls.enablePan = false;
controls.minDistance = 1.5;
controls.maxDistance = 8;
controls.rotateSpeed = isMobile ? 0.5 : 0.8;

const vr = initVRLocomotion({ renderer, camera, scene, controls });

// Stars
const starsGeometry = new THREE.BufferGeometry();
const starPos = [];
for (let i = 0; i < 3000; i++) {
    starPos.push((Math.random() - 0.5) * 200, (Math.random() - 0.5) * 200, (Math.random() - 0.5) * 200);
}
starsGeometry.setAttribute("position", new THREE.Float32BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starsGeometry, new THREE.PointsMaterial({ color: 0xffffff, size: 0.05 })));

const loader = new THREE.TextureLoader();

// Earth
const earth = new THREE.Mesh(
    new THREE.SphereGeometry(1, 64, 64),
    new THREE.MeshStandardMaterial({
        map: loader.load("https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg")
    })
);
scene.add(earth);

// Clouds
const clouds = new THREE.Mesh(
    new THREE.SphereGeometry(1.015, 64, 64),
    new THREE.MeshStandardMaterial({
        map: loader.load("https://threejs.org/examples/textures/planets/earth_clouds_1024.png"),
        transparent: true, opacity: 0.35
    })
);
scene.add(clouds);

// Atmosphere
scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(1.08, 64, 64),
    new THREE.MeshBasicMaterial({ color: 0x0099ff, transparent: true, opacity: 0.12, side: THREE.BackSide })
));

// Light
const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(5, 3, 5);
scene.add(light);

renderer.setAnimationLoop(() => {
    vr.update();
    earth.rotation.y += isMobile ? 0.003 : 0.002;
    clouds.rotation.y += isMobile ? 0.0015 : 0.001;
    renderer.render(scene, camera);
});

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
