<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>微缩世界 · EdyStudio</title><style>*{box-sizing:border-box}body{margin:0;background:#101c20;color:#ece9dc;font-family:'Songti SC',serif}header{height:70px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff25;gap:16px}a{color:inherit;text-decoration:none;font:11px monospace;letter-spacing:1px}strong{font-weight:400;font-size:18px;letter-spacing:3px}nav{display:flex;gap:8px}button{background:transparent;color:#bdc9c9;border:1px solid #5b7075;padding:9px 15px;cursor:pointer;font-family:inherit}button.active{background:#d8e4da;color:#162830}iframe{width:100%;height:calc(100dvh - 70px);border:0;display:block}@media(max-width:700px){header{height:110px;flex-wrap:wrap;padding:12px 16px}nav{width:100%;justify-content:center}iframe{height:calc(100dvh - 110px)}button{padding:8px 12px}}</style><body><header><a href="../">← GPT6</a><strong>微缩世界</strong><nav><button class="active" data-src="lawson/">雨夜罗森</button><button data-src="landscapes/">山林民宿</button><button data-src="landscapes/?scene=wreck">飞机残骸</button></nav></header><iframe id="world" title="可交互三维微缩场景" src="lawson/"></iframe><script>document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('world').src=b.dataset.src;});</script></body></html>
