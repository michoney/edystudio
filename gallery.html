<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Gallery — Creative AI Studio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { background: #06080d; font-family: 'Courier New', monospace; }

  #bg-frame { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; z-index: 0; pointer-events: none; }

  .overlay { position: relative; z-index: 1; width: 100%; height: 100vh; overflow-y: auto; padding: 30px 20px; pointer-events: none; }
  .overlay::-webkit-scrollbar { width: 4px; }
  .overlay::-webkit-scrollbar-thumb { background: rgba(80,160,80,0.3); border-radius: 2px; }

  .header { text-align: center; padding: 20px 0 10px; pointer-events: auto; }
  .header h1 { font-size: 24px; color: #eadde5; letter-spacing: 4px; text-shadow: 0 0 30px rgba(100,150,200,0.2); }
  .header p { font-size: 13px; color: rgba(234,221,229,0.5); margin-top: 6px; }

  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; max-width: 1300px; margin: 20px auto; padding: 0 10px; pointer-events: auto; }

  .card {
    aspect-ratio: 4/3;
    background: transparent;
    border: 1px solid rgba(234,221,229,0.12);
    border-radius: 10px;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: all 0.35s ease; text-decoration: none; color: #eadde5;
    backdrop-filter: none;
    position: relative;
  }
  .card::before {
    content: ''; position: absolute; inset: 0;
    background: rgba(6,8,13,0.1);
    border-radius: 10px;
    transition: 0.35s;
  }
  .card:hover { border-color: rgba(234,221,229,0.4); transform: translateY(-2px); }
  .card:hover::before { background: rgba(6,8,13,0.25); }

  .card .icon { font-size: 30px; position: relative; z-index: 1; opacity: 0.7; }
  .card .name { font-size: 11px; text-align: center; color: #eadde5; letter-spacing: 1px; line-height: 1.3; margin-top: 6px; position: relative; z-index: 1; }
  .card .tag { font-size: 9px; color: rgba(234,221,229,0.35); margin-top: 3px; position: relative; z-index: 1; }

  .back { position: fixed; top: 14px; left: 14px; z-index: 10; pointer-events: auto; }
  .back a { color: rgba(234,221,229,0.5); text-decoration: none; font-size: 12px; padding: 5px 12px; border: 1px solid rgba(234,221,229,0.1); border-radius: 4px; transition: 0.3s; }
  .back a:hover { color: #eadde5; border-color: rgba(234,221,229,0.3); }

  @media (max-width: 900px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 10px; } }
  @media (max-width: 540px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; } .header h1 { font-size: 18px; } }
</style>
</head>
<body>

<iframe id="bg-frame" src="gallery/penderecki-garden/" scrolling="no"></iframe>

<div class="back"><a href="index.html">← Edy Studio</a></div>
<div class="overlay">
  <div class="header">
    <h1>✦ Particle Gallery ✦</h1>
    <p>15 generative effects</p>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
const projects = [
  { name: '3D Fireworks', icon: '✨', tag: 'p5.js · 3D', file: '3d-fireworks' },
  { name: '3D Roses', icon: '🌹', tag: 'p5.js · WebGL', file: '3d-roses' },
  { name: 'Cosmic Fireworks', icon: '🌌', tag: 'p5.js · 3D', file: 'cosmic-fireworks' },
  { name: 'Spectral Flow', icon: '🌀', tag: 'p5.js · 3D', file: 'cyclic-spectral-flow' },
  { name: 'Flow Field', icon: '🌊', tag: 'p5.js', file: 'flow-field' },
  { name: 'Flower Particles', icon: '🌸', tag: 'p5.js', file: 'flower-particles' },
  { name: 'Neural Falls', icon: '💧', tag: 'p5.js', file: 'neural-falls' },
  { name: 'Particle Flock', icon: '🐟', tag: 'p5.js', file: 'particle-flock' },
  { name: 'Particles to Image', icon: '🎯', tag: 'p5.js', file: 'particles-to-image' },
  { name: 'Penderecki Garden', icon: '🏛️', tag: 'Three.js · PCD', file: 'penderecki-garden' },
  { name: 'Perlin Flow', icon: '🎨', tag: 'p5.js', file: 'perlin-flow' },
  { name: 'Planet Rings', icon: '🪐', tag: 'p5.js', file: 'planet-rings' },
  { name: 'Radioactivity', icon: '☢️', tag: 'p5.js', file: 'radioactivity' },
  { name: 'Recode Rethink', icon: '🔮', tag: 'WebGL2', file: 'recode-rethink' },
  { name: 'Spirit', icon: '🕊️', tag: 'WebGL2 + Olon', file: 'webgl-particles' }
];

const grid = document.getElementById('grid');
projects.forEach(p => {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = `gallery/${p.file}/index.html`;
  a.target = '_blank';
  a.innerHTML = `<div class="icon">${p.icon}</div>
                 <div class="name">${p.name}</div>
                 <div class="tag">${p.tag}</div>`;
  grid.appendChild(a);
});
</script>
</body>
</html>
