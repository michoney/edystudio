<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Gallery — Creative AI Studio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { background: #06080d; font-family: 'Courier New', monospace; }

  #bg-frame { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; z-index: 0; pointer-events: none; }

  .overlay {
    position: relative; z-index: 1; width: 100%; height: 100vh;
    display: flex; flex-direction: column;
    pointer-events: none; overflow: hidden;
  }

  .header { text-align: center; padding: 12px 20px 0; pointer-events: auto; }
  .header h1 { font-size: 16px; color: rgba(234,221,229,0.5); letter-spacing: 3px; font-weight: normal; }
  .header p { display: none; }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    max-width: 500px;
    margin: auto auto 14px auto;
    padding: 0 8px;
    pointer-events: auto;
    width: 100%;
  }

  .card {
    aspect-ratio: auto;
    background: transparent;
    border: 1px solid rgba(234,221,229,0.06);
    border-radius: 6px;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 5px 2px; gap: 1px;
    transition: all 0.3s ease; text-decoration: none; color: rgba(234,221,229,0.6);
    position: relative;
  }
  .card::before {
    content: ''; position: absolute; inset: 0;
    background: rgba(6,8,13,0.08);
    border-radius: 6px;
    transition: 0.3s;
  }
  .card:hover { border-color: rgba(234,221,229,0.25); color: #eadde5; }
  .card:hover::before { background: rgba(6,8,13,0.2); }

  .card .icon { font-size: 14px; position: relative; z-index: 1; line-height: 1; }
  .card .name { font-size: 8px; text-align: center; color: inherit; letter-spacing: 0.5px; line-height: 1.2; position: relative; z-index: 1; }
  .card .tag { display: none; }

  .back { position: fixed; top: 10px; left: 12px; z-index: 10; pointer-events: auto; }
  .back a { color: rgba(234,221,229,0.3); text-decoration: none; font-size: 10px; padding: 3px 8px; border: 1px solid rgba(234,221,229,0.08); border-radius: 3px; transition: 0.3s; }
  .back a:hover { color: rgba(234,221,229,0.6); border-color: rgba(234,221,229,0.2); }

  @media (max-width: 540px) { .grid { grid-template-columns: repeat(3, 1fr); max-width: 320px; } }
</style>
</head>
<body>

<iframe id="bg-frame" src="gallery/penderecki-garden/" scrolling="no"></iframe>

<div class="back"><a href="index.html">← Edy</a></div>
<div class="overlay">
  <div class="header">
    <h1>✦ Particle Gallery</h1>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
const projects = [
  { name: '3D Fireworks', icon: '✨', file: '3d-fireworks' },
  { name: '3D Roses', icon: '🌹', file: '3d-roses' },
  { name: 'Cosmic Fireworks', icon: '🌌', file: 'cosmic-fireworks' },
  { name: 'Spectral Flow', icon: '🌀', file: 'cyclic-spectral-flow' },
  { name: 'Flow Field', icon: '🌊', file: 'flow-field' },
  { name: 'Flower Particles', icon: '🌸', file: 'flower-particles' },
  { name: 'Neural Falls', icon: '💧', file: 'neural-falls' },
  { name: 'Particle Flock', icon: '🐟', file: 'particle-flock' },
  { name: 'Particles to Image', icon: '🎯', file: 'particles-to-image' },
  { name: 'Penderecki Garden', icon: '🏛️', file: 'penderecki-garden' },
  { name: 'Perlin Flow', icon: '🎨', file: 'perlin-flow' },
  { name: 'Planet Rings', icon: '🪐', file: 'planet-rings' },
  { name: 'Radioactivity', icon: '☢️', file: 'radioactivity' },
  { name: 'Recode Rethink', icon: '🔮', file: 'recode-rethink' },
  { name: 'Spirit', icon: '🕊️', file: 'webgl-particles' }
];

const grid = document.getElementById('grid');
projects.forEach(p => {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = `gallery/${p.file}/index.html`;
  a.target = '_blank';
  a.innerHTML = `<div class="icon">${p.icon}</div>
                 <div class="name">${p.name}</div>`;
  grid.appendChild(a);
});
</script>
</body>
</html>
