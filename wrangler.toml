# Cloudflare Workers 静态站点部署配置
# 部署命令: ./deploy.sh  或  npx wrangler deploy
# 部署后访问: https://edystudio.michoney68.workers.dev
# 注意: assets.directory 指向构建产物目录 dist/（由 deploy.sh 生成，仅含站点文件）

name = "edystudio"
