<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>树 VR · Arbor LiDAR Tree · Particle Garden</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#02050a;color:#bfe6d0;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}
  #info{position:fixed;left:14px;bottom:12px;font-size:12px;letter-spacing:.05em;opacity:.75;z-index:2;pointer-events:none}
  #hint{position:fixed;right:14px;top:12px;font-size:12px;opacity:.8;z-index:2;pointer-events:none}
</style>
</head>
<body>
<div id="hint">🥽 点右上 VR 按钮进入头显 · 树 VR（Arbor LiDAR 粒子树）</div>
<div id="info">iPhone LiDAR 扫描树 → 粒子呈现 · 数字化树木</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { initVRLocomotion, createVRButton } from '../../assets/vr-controls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02050a);
scene.fog = new THREE.Fog(0x02050a, 25, 70);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 200);
camera.position.set(6, 3.5, 9);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(createVRButton(renderer));
const controls = new OrbitControls(camera, renderer.domElement);

const grid = new THREE.GridHelper(20, 12, 0x1e4a34, 0x0d2b1e);
grid.position.y = -0.01;
scene.add(grid);

// —— 手柄移动：抓取 / 飞行 / 摇杆（类似 Google Earth VR）——
const vr = initVRLocomotion({ renderer, camera, scene, controls });

const hint = document.createElement('div');
hint.style.cssText = 'position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:3;font-size:12px;opacity:.85;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:20px;pointer-events:none';
hint.textContent = '扳机: 抓取拖动世界 · 握把: 向手柄方向飞行 · 左摇杆: 移动 · 右摇杆: 转向';
document.body.appendChild(hint);

// —— 粒子树：主干 + 枝杈（线段） + 叶片粒子 ——
function makeTree() {
  const g = new THREE.Group();
  const branchMat = new THREE.LineBasicMaterial({ color: 0x8a5a33, transparent: true, opacity: .85 });
  const leafMat = new THREE.PointsMaterial({ color: 0x5dd68a, size: 0.09, sizeAttenuation: true,
    transparent: true, opacity: .9, blending: THREE.AdditiveBlending, depthWrite: false });
  const branches = [];
  const leafPos = [];
  const stack = [{ x:0, y:0, z:0, len:2.0, dir:[0,1,0], depth:0 }];
  let guard = 0;
  while (stack.length && guard < 600) {
    guard++;
    const n = stack.pop();
    const { x, y, z, len, dir, depth } = n;
    const scale = Math.pow(0.72, depth);
    const seg = 5;
    let px = x, py = y, pz = z, dx = dir[0], dy = dir[1], dz = dir[2];
    for (let i = 0; i < seg; i++) {
      const s = (i+1)/seg;
      dx += (Math.random()-0.5)*0.5*scale;
      dy += (Math.random()-0.5)*0.4*scale;
      dz += (Math.random()-0.5)*0.5*scale;
      const L = Math.hypot(dx,dy,dz) || 1;
      dx/=L; dy/=L; dz/=L;
      const nx = px + dx*len/seg*0.75, ny = py + dy*len/seg, nz = pz + dz*len/seg;
      const geo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(px,py,pz), new THREE.Vector3(nx,ny,nz) ]);
      const line = new THREE.Line(geo, branchMat);
      line.userData = { base:[px,py,pz], top:[nx,ny,nz], depth };
      g.add(line); branches.push(line);
      px=nx; py=ny; pz=nz;
    }
    if (depth < 5) {
      const children = depth<2 ? 4 : 3;
      for (let c=0;c<children;c++){
        stack.push({ x:px, y:py, z:pz, len:len*0.72, dir:[dx+Math.random()*0.9-0.45, dy+Math.random()*0.5, dz+Math.random()*0.9-0.45], depth:depth+1 });
      }
    }
    for (let k=0;k<14;k++){
      leafPos.push(px + (Math.random()-0.5)*0.5, py + (Math.random()-0.5)*0.5, pz + (Math.random()-0.5)*0.5);
    }
  }
  const leafGeo = new THREE.BufferGeometry();
  leafGeo.setAttribute('position', new THREE.Float32BufferAttribute(leafPos, 3));
  const leaves = new THREE.Points(leafGeo, leafMat);
  g.add(leaves);
  g.userData.branches = branches;
  return g;
}

const tree = makeTree();
scene.add(tree);
const treeTilt = new THREE.Group();
treeTilt.add(tree);
scene.add(treeTilt);

const glow = new THREE.PointLight(0x7fe0a5, 0.7, 20);
glow.position.set(0, 3.5, 1.5);
scene.add(glow);

renderer.setAnimationLoop((tms) => {
  vr.update();
  const t = tms/1000;
  treeTilt.rotation.y = Math.sin(t*0.08)*0.12;
  tree.rotation.x = Math.sin(t*0.05)*0.03;
  tree.rotation.z = Math.cos(t*0.06)*0.03;
  renderer.render(scene, camera);
});
window.addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
