<body>
  <main id="stage" aria-label="粒子 DNA 实时三维场景">
    <canvas id="scene"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="oskm" aria-label="OSKM 重编程因子">
      <span>INDUCIBLE OSKM · PARTIAL REPROGRAMMING</span>
      <b data-factor="O">OCT4</b><b data-factor="S">SOX2</b><b data-factor="K">KLF4</b><b data-factor="M">c-MYC</b>
      <small>SHORT PULSES · AVOID FULL PLURIPOTENCY</small>
    </div>
    <section class="study" aria-label="Cell 论文实验机制">
      <p class="journal">CELL 167 · 1719–1733 · 2016</p>
      <h1>部分重编程，<br><em>不是永久返老还童。</em></h1>
      <ol>
        <li><b>01</b><span>衰老 / 早衰细胞与小鼠模型</span></li>
        <li><b>02</b><span>预先导入可诱导 OSKM 系统</span></li>
        <li><b>03</b><span>多西环素开启短周期表达</span></li>
        <li><b>04</b><span>部分衰老标志与修复能力改善</span></li>
      </ol>
      <button id="induction" type="button" aria-pressed="false"><i></i><span>DOXYCYCLINE SWITCH</span><strong>OFF</strong></button>
      <p class="caution">研究证据来自细胞与小鼠模型；持续表达可能丢失细胞身份并增加畸胎瘤/肿瘤风险，不能解读为已获批的人体延寿疗法。</p>
    </section>
